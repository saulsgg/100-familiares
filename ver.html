<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>100 Familiares · Jugador</title>
<meta name="theme-color" content="#070a24">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Lilita One';src:url(fonts/lilita.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Rubik';src:url(fonts/rubik-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Rubik';src:url(fonts/rubik-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Rubik';src:url(fonts/rubik-800.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Rubik';src:url(fonts/rubik-500.woff2) format('woff2');font-weight:400;font-display:swap}
/*
VOICE: concurso de tele hecho en casa, de noche y en familia: ruidoso, cálido, fácil de leer desde el sillón
IDEA: un set de televisión con luces de colores que bailan con la música y un tablero enmarcado de foquitos
PICTURE: fichas azules de pantalla de tele que giran para mostrar la respuesta, dentro de una marquesina de focos
COLOUR and TYPE: azul noche de estudio, fichas azules con números dorados, turquesa y dorado para los equipos, rosa para la emoción; Lilita One + Rubik
RENDIMIENTO: lo que se anima solo usa transform u opacity; luces, rayos y focos se dibujan una vez en canvas
*/
:root{color-scheme:dark;--bg:#070a24;--bg2:#121746;--bg3:#1e2569;--panel:rgba(18,23,70,.88);--ink:#fff8ec;--mute:#b9bfe8;--gold:#ffc42e;--pink:#ff2e88;--teal:#14b8a6;--violet:#8b5cf6;--cink:#14123a;--line:rgba(255,255,255,.14);--disp:'Lilita One',Rubik,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:70px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
select,input,textarea{font-size:16px;background:#0a0d33;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;color:var(--ink);width:100%}
select option{background:#0a0d33}

/* ---------- escenario con luces de colores ---------- */
.bgstage{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(110% 55% at 50% -5%,#1d2580,rgba(29,37,128,0) 65%),radial-gradient(80% 45% at 50% 108%,rgba(124,72,255,.4),rgba(124,72,255,0) 70%),var(--bg);transition:opacity .8s}

@keyframes sweep{from{transform:rotate(var(--a1))}to{transform:rotate(var(--a2))}}
.bgstage .flash{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;will-change:opacity}
body.steal .bgstage{opacity:.8}
.vign{position:fixed;top:0;right:0;bottom:0;left:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse 75% 65% at 50% 45%,transparent 35%,rgba(0,0,0,.78) 100%);transition:opacity .8s}
body.steal .vign{opacity:1}
.redflash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:44;pointer-events:none;background:radial-gradient(closest-side,rgba(255,40,70,.45),rgba(255,40,70,0));opacity:0}

/* ---------- barra de arriba ---------- */
.top{position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 3vw;padding:8px max(3vw,12px);background:linear-gradient(rgba(7,10,36,.94),rgba(7,10,36,.55))}
.brand{display:inline-flex;align-items:center;gap:8px;font:400 20px var(--disp);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bmark{font:400 15px/1 var(--disp);background:linear-gradient(#ffe58a,#ff9a1a);color:#3a1a00;border-radius:8px;padding:5px 6px 4px;flex:none}
.navl{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}.navl::-webkit-scrollbar{display:none}
@media (max-width:600px){.navl{-webkit-mask:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 26px),transparent);padding-right:22px}.navl a{padding:8px 10px;font-size:14px}}
.navl a{flex:none;color:var(--mute);text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:500;font-size:15px;min-height:42px;display:inline-flex;align-items:center;white-space:nowrap}
.navl a[aria-current=page]{background:var(--bg3);color:var(--ink)}
@media(max-width:600px){.brand{display:none}.navl{width:100%}}
.view{display:none}.view.on{display:block}

/* ---------- botones y controles ---------- */
.btn{min-height:46px;border:0;border-radius:14px;padding:10px 16px;font-weight:800;background:var(--ink);color:var(--cink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;line-height:1.15}
.btn:active{transform:translateY(2px)}
.btn.pink{background:var(--pink);color:#fff}
.btn.teal{background:var(--teal);color:#062a26}
.btn.gold{background:var(--gold);color:#3a1a00}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn[aria-pressed=true]{background:var(--teal)!important;color:#062a26!important;border-color:var(--teal)!important}
.chip{min-height:38px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:6px 14px;font-size:14px;font-weight:700}
.chip[aria-pressed=true]{background:var(--gold);color:var(--cink);border-color:var(--gold)}
.hint{color:var(--mute);font-size:14px;margin:0}
.center{text-align:center;justify-content:center}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.seg legend{font-weight:600;margin-bottom:6px;padding:0;font-size:14px;color:var(--mute)}
.seg label{display:inline-flex;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{padding:7px 14px;border-radius:999px;border:1px solid var(--line);min-height:40px;display:inline-flex;align-items:center;font-size:15px}
.seg input:checked+span{background:var(--gold);color:var(--cink);border-color:var(--gold);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.fld{display:grid;gap:6px;font-size:14px;color:var(--mute)}

/* ---------- logo ---------- */
.kick{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:5px 14px 5px 10px;border-radius:999px;font-size:14px;font-weight:700;margin:0}
.live{position:relative;width:9px;height:9px;border-radius:50%;background:#ff3b5c;flex:none}
.live::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:#ff3b5c;animation:livep 1.6s ease-out infinite}
@keyframes livep{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.logo{position:relative;display:inline-grid;place-items:center;padding:8px 18px;isolation:isolate}
.logo img.rays{position:absolute;left:50%;top:50%;width:760px;width:min(130vw,760px);height:auto;aspect-ratio:1;margin:calc(760px/-2) 0 0 calc(760px/-2);margin:calc(min(130vw,760px)/-2) 0 0 calc(min(130vw,760px)/-2);z-index:-1;opacity:.9;animation:spin 70s linear infinite;will-change:transform;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ltitle{display:grid;justify-items:center;margin:0;font:400 1em var(--disp);text-transform:uppercase;line-height:.9;animation:breathe 3.2s ease-in-out infinite;will-change:transform}
@keyframes breathe{50%{transform:scale(1.03)}}
.ltitle span{display:block;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:0 .05em}
.lnum{font-size:170px;font-size:clamp(84px,22vw,170px);background-image:linear-gradient(180deg,#fffbea 6%,#ffe27a 32%,#ffc42e 56%,#ff8f14 92%);filter:drop-shadow(0 2px 0 #c86a0c) drop-shadow(0 2px 0 #a45208) drop-shadow(0 2px 0 #7d3c05) drop-shadow(0 3px 0 #4f2403) drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.lrest{font-size:68px;font-size:clamp(34px,9vw,68px);max-width:12ch;text-wrap:balance;background-image:linear-gradient(180deg,#fff 10%,#ffe3f0 42%,#ff6fae 72%,#ff2e88 100%);filter:drop-shadow(0 2px 0 #b0105a) drop-shadow(0 2px 0 #860b44) drop-shadow(0 2px 0 #5a072e) drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.logo.enter .ltitle{animation:dropin .85s cubic-bezier(.2,1.5,.4,1) both,breathe 3.2s ease-in-out .9s infinite}
@keyframes dropin{from{opacity:0;transform:translateY(-36px) scale(.55)}}

/* ---------- inicio ---------- */
.home{max-width:880px;margin:0 auto;padding:10px 4vw 64px;padding:10px max(4vw,16px) 64px;text-align:center;display:grid;justify-items:center;gap:16px;overflow-x:clip}
.lead{margin:0;max-width:40ch;color:var(--mute);font-size:18px;font-size:clamp(15px,2vw,18px)}
.setup{display:grid;justify-items:center;gap:16px;width:100%;margin:0}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;gap:clamp(18px,3vw,28px);width:100%;text-align:left}
.tcard{display:grid;gap:2px;padding:14px 16px 12px;border-radius:20px;color:var(--cink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 12px 30px rgba(0,0,0,.35);animation:float 5s ease-in-out infinite;will-change:transform}
.tcard.t1{background:linear-gradient(160deg,#5ff0de,#14b8a6)}
.tcard.t2{background:linear-gradient(160deg,#ffe38a,#ffc42e);animation-delay:-2.5s}
@keyframes float{50%{transform:translateY(-4px)}}
.tcard.bump{animation:bump .32s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{45%{transform:scale(1.04) rotate(-.8deg)}}
.tcard>span{font-weight:800;font-size:13px;opacity:.75}
.tcard input{width:100%;border:0;border-bottom:2px solid rgba(0,0,0,.2);border-radius:0;background:transparent;font:400 28px var(--disp);font:400 clamp(22px,3.4vw,28px) var(--disp);color:var(--cink);padding:2px 0;min-height:44px;outline:none}
.tcard input::placeholder{color:rgba(20,18,58,.45)}
.vs{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ff8ac0,var(--pink) 58%,#a80f55);font:400 24px var(--disp);color:#fff;box-shadow:0 0 0 4px var(--bg2),0 0 26px rgba(255,46,136,.65);animation:vsb 2.4s ease-in-out infinite;will-change:transform}
.vs::before{content:"";position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);animation:spin 8s linear infinite}
@keyframes vsb{50%{transform:scale(1.08)}}
@media(max-width:600px){.teams{grid-template-columns:1fr;gap:16px}.vs{justify-self:center}}
.ways{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.ways legend{font:400 22px var(--disp);margin:0 auto 8px;padding:0}
@media(max-width:700px){.ways{grid-template-columns:1fr}}
.way{position:relative;display:flex}
.way input{position:absolute;opacity:0;pointer-events:none}
.way span{flex:1;display:grid;gap:4px;align-content:start;padding:14px;border-radius:18px;background:rgba(19,24,72,.9);border:2px solid rgba(255,255,255,.12);text-align:left;transition:transform .2s,border-color .2s;cursor:pointer}
.way b{display:flex;align-items:center;gap:8px;font:400 21px var(--disp)}
.way small{color:var(--mute);font-size:14px;line-height:1.3}
.way input:checked+span{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,196,46,.16),rgba(19,24,72,.95));transform:translateY(-3px)}
.way input:checked+span b{color:#ffe29a}
.way input:focus-visible+span{outline:3px solid var(--gold);outline-offset:3px}
.wi{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.go{position:relative;isolation:isolate;border:0;border-radius:22px;padding:16px 46px;font:400 40px/1 var(--disp);font:400 clamp(30px,5vw,40px)/1 var(--disp);color:#fff;background:linear-gradient(180deg,#ff5aa2,var(--pink) 55%,#d81a73);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 10px 30px rgba(255,46,136,.45);width:420px;width:min(100%,420px)}
.go::before{content:"";position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px;border-radius:28px;background:radial-gradient(closest-side,rgba(255,46,136,.55),transparent);z-index:-1;animation:halo 2.2s ease-in-out infinite}
@keyframes halo{50%{opacity:.2;transform:scale(1.05)}}
.go:active{transform:translateY(3px)}
.goes{display:grid;gap:10px;justify-items:center;width:100%}
details.adj{width:100%;background:rgba(19,24,72,.9);border-radius:18px;border:1px solid rgba(255,255,255,.1);text-align:left}
details.adj summary{cursor:pointer;list-style:none;padding:14px 18px;font:400 21px var(--disp);display:flex;justify-content:space-between;align-items:center;min-height:56px}
details.adj summary::-webkit-details-marker{display:none}
details.adj summary::after{content:"＋";color:var(--gold)}
details.adj[open] summary::after{content:"－"}
.adjgrid{display:grid;grid-template-columns:repeat(2,min0);grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;padding:0 18px 20px}
.adjgrid section{display:grid;gap:12px;align-content:start}
.adjgrid h3{font:400 21px var(--disp);color:var(--gold);margin-top:4px}
@media(max-width:700px){.adjgrid{grid-template-columns:1fr}}
.links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;font-weight:500;background:rgba(7,10,36,.5)}

/* ---------- tablero ---------- */
.play{max-width:1400px;margin:0 auto;padding:6px 3vw 24px;padding:6px max(3vw,12px) 24px}
.empty{text-align:center;padding:60px 16px;font-size:18px}
.score{display:grid;grid-template-columns:min0 auto min0;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;gap:clamp(8px,1.6vw,16px);align-items:stretch}
.team{position:relative;isolation:isolate;border-radius:20px;padding:8px 10px 10px;text-align:center;color:var(--cink);display:grid;align-content:center;transition:transform .3s}
.team::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:20px;background:var(--tb);z-index:-1;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 10px 26px rgba(0,0,0,.35)}
.team.t1{--tb:linear-gradient(160deg,#5ff0de,#14b8a6);--glow:rgba(63,224,204,.7)}
.team.t2{--tb:linear-gradient(160deg,#ffe38a,#ffc42e);--glow:rgba(255,196,46,.7)}
.tn{font:400 26px/1.1 var(--disp);font:400 clamp(16px,2.2vw,26px)/1.1 var(--disp);overflow-wrap:anywhere}
.ts{font:400 70px/1 var(--disp);font:400 clamp(34px,5.5vw,70px)/1 var(--disp)}
.team .spot{position:absolute;top:-14px;right:-14px;bottom:-14px;left:-14px;border-radius:30px;background:radial-gradient(closest-side,var(--glow),transparent);z-index:-2;opacity:0;transition:opacity .4s}
.team .tag{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%) scale(.5);background:var(--pink);color:#fff;font:800 13px Rubik,sans-serif;padding:2px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.team.lit .spot{opacity:.9}
.team.lit .tag,.team.stealer .tag{opacity:1;transform:translateX(-50%) scale(1)}
.team.stealer{z-index:6;transform:scale(1.05)}
.team.stealer .spot{opacity:1;animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.35}15%{opacity:1}30%{opacity:.5}45%{opacity:.95}}
.team.pts{animation:pts .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pts{35%{transform:scale(1.08)}}
.bank{display:grid;justify-items:center;align-content:center;min-width:170px;min-width:clamp(92px,14vw,170px);padding:6px 12px;border-radius:20px;background:#0a0d33;box-shadow:inset 0 0 0 2px rgba(255,214,110,.45)}
.bank small{font-weight:700;color:var(--mute);font-size:15px;font-size:clamp(11px,1.3vw,15px)}
.bank b{font:400 70px/1 var(--disp);font:400 clamp(34px,5.5vw,70px)/1 var(--disp);color:var(--gold)}
.bank .ml{font-weight:700;font-size:15px;font-size:clamp(11px,1.3vw,15px);color:#ffb3d4}
.qstrip{display:grid;grid-template-columns:auto min0 auto;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;margin:14px 0 12px;padding:10px 14px;border-radius:18px;background:linear-gradient(180deg,#151b5c,#0d1142);box-shadow:inset 0 0 0 2px rgba(156,192,255,.35)}
.qround{font:400 20px/1 var(--disp);font:400 clamp(15px,1.8vw,20px)/1 var(--disp);color:#3a1a00;background:linear-gradient(180deg,#ffe27a,#ffb020);padding:8px 12px;border-radius:12px;white-space:nowrap}
.qbody{display:grid;gap:4px;justify-items:center;text-align:center}
.qpre{font-weight:700;color:var(--mute);font-size:15px;font-size:clamp(12px,1.4vw,15px);margin:0}
.qq{margin:0;font:800 34px/1.22 Rubik,sans-serif;font:800 clamp(18px,2.8vw,34px)/1.22 Rubik,sans-serif;text-wrap:balance}
.qq .k{position:relative;display:inline-block}
.qq .k i{position:absolute;top:.1em;right:-.06em;bottom:.1em;left:-.06em;border-radius:6px;background:linear-gradient(90deg,#2d3aa0,#4a58d0,#2d3aa0);transform-origin:right center}
.qq .k span{opacity:.001}
.qq.run .k i{animation:unbar .32s ease-in forwards;animation-delay:calc(var(--i) * var(--wd,190ms))}
.qq.run .k span{animation:goldflash .7s ease-out forwards;animation-delay:calc(var(--i) * var(--wd,190ms) + 150ms)}
.qq.shown .k i{display:none}.qq.shown .k span{opacity:1}
@keyframes unbar{to{transform:scaleX(0)}}
@keyframes goldflash{0%{opacity:1;color:#ffe27a}100%{opacity:1;color:var(--ink)}}
.qact .prep{background:var(--pink);color:#fff;animation:prepb .6s ease-in-out infinite alternate}
@keyframes prepb{to{scale:1.07}}
.qact{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:2px}
@media(max-width:600px){.qstrip{grid-template-columns:min0 auto;grid-template-columns:minmax(0,1fr) auto}.qround{grid-column:1/-1;justify-self:start}}
.tring{position:relative;z-index:6;width:62px;height:62px;padding:0;border:0;background:none;flex:none;cursor:pointer;color:#fff;--tc:var(--teal);-webkit-tap-highlight-color:transparent}
.tring .tg{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;scale:var(--g,1);transform-origin:72% 50%;transition:scale .45s cubic-bezier(.3,1.5,.5,1)}
.tring .tsv{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.tring circle{fill:none;stroke-width:6}
.tring .tbg{fill:#0b0f3a;stroke:rgba(255,255,255,.08);stroke-width:1}
.tring .tr{stroke:rgba(255,255,255,.13)}
.tring .tf{stroke:var(--tc);stroke-linecap:round;stroke-dasharray:132;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .3s}
.tring .tico{position:relative;width:44%;height:44%;fill:none;stroke:var(--tc);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.tring b{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font:400 25px/1 var(--disp);color:#fff;transition:color .3s}
.tring.idle b,.tring.out b{display:none}
.tring.run .tico{display:none}
.tring .tbadge{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font:800 10px/1 Rubik,sans-serif;font-style:normal;padding:3px 7px;border-radius:99px;background:var(--gold);color:var(--cink);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:opacity .2s}
.tring.run .tbadge{opacity:0}
.tring.robo,.tring.out{--tc:var(--pink)}
.tring.out .tbadge{background:var(--pink);color:#fff}
.tring.hot[data-l="5"],.tring.hot[data-l="4"]{--tc:#ffc42e}
.tring.hot[data-l="3"]{--tc:#ff8a1a}
.tring.hot[data-l="2"],.tring.hot[data-l="1"]{--tc:#ff3355}
.tring.hot .tg,.tring.big .tg{filter:drop-shadow(0 0 6px var(--tc)) drop-shadow(0 0 16px var(--tc))}
.tring.hot b{color:var(--tc);text-shadow:0 0 10px rgba(0,0,0,.6)}
.tring b.pop{animation:tpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes tpop{0%{scale:1.8;opacity:.3}100%{scale:1;opacity:1}}

.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;margin:-10.5% 0 0 -10.5%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,#fff6cf,#ffc42e 55%,#c27a00);box-shadow:inset 0 0 0 3px #fff3c4,0 6px 16px rgba(0,0,0,.45);font:400 32px/1 var(--disp);font:400 clamp(20px,4vmin,32px)/1 var(--disp);color:#5a2a00}

.wcard{display:grid;justify-items:center;gap:8px;text-align:center;width:520px;width:min(520px,100%)}

/* ---------- intro ---------- */
.intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:grid;place-items:center;align-content:center;gap:34px;gap:clamp(18px,4vmin,34px);padding:5vmin;background:radial-gradient(70% 55% at 50% 42%,rgba(44,52,160,.6),rgba(44,52,160,0) 78%),#060920;text-align:center;cursor:pointer;overflow:hidden;transition:opacity .7s,transform .7s}
.intro .marq{min-width:560px;min-width:min(86vw,560px);padding:44px 64px;padding:clamp(22px,4.5vmin,44px) clamp(22px,6vmin,64px);border-radius:40px;border-radius:clamp(24px,4vmin,40px);--cd:.45s}
.intro .lnum{font-size:210px;font-size:clamp(84px,24vmin,210px)}
.intro .lrest{font-size:84px;font-size:clamp(34px,8.5vmin,84px)}
.intro .ilogo,.intro .kick,.intro .go{opacity:0}
.intro .go{font-size:36px;font-size:clamp(26px,6.5vw,36px);padding:16px 34px;width:auto}
.intro.on .ilogo{animation:introin 1.1s cubic-bezier(.2,1.4,.4,1) .25s both}
@keyframes introin{0%{opacity:0;transform:scale(.3) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.intro.on .kick{animation:fadein .6s 1s both}
.intro.on .go{animation:fadein .6s 1.3s both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.intro.out{opacity:0;transform:scale(1.12);pointer-events:none}
.whiteflash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:#fff;opacity:0;pointer-events:none}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:560px;max-width:min(92vw,560px);background:var(--ink);color:var(--cink);font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:65;text-align:center}
.toast.show{opacity:1}
@media(max-width:600px){.toast{top:calc(12px + env(safe-area-inset-top));bottom:auto}}
.conf{position:fixed;top:-20px;width:12px;height:16px;z-index:55;pointer-events:none;will-change:transform}

/* ---------- dinero rápido ---------- */
.fm-top{display:grid;grid-template-columns:min0 auto min0;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:40px;gap:clamp(12px,3vw,40px);align-items:center}
.fm-top h2{font:400 64px/1 var(--disp);font:400 clamp(34px,5vw,64px)/1 var(--disp);color:var(--gold)}
.fm-top p{margin:4px 0 0;color:var(--mute)}
.timer{width:180px;width:clamp(120px,15vw,180px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p,100)*1%),var(--bg3) 0);display:grid;place-items:center}
.timer b{width:80%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:400 72px var(--disp);font:400 clamp(44px,5.5vw,72px) var(--disp)}
.fm-tot{text-align:right}
.fm-tot .lbl{color:var(--mute);font-weight:500}
.fm-tot .big{font:400 96px/1 var(--disp);font:400 clamp(52px,7vw,96px)/1 var(--disp)}
.meter{height:14px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .4s}
.tctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:18px 0 6px}
.tctl label{display:grid;gap:4px;font-size:14px;color:var(--mute);flex:1 1 160px}
.fwin{background:var(--gold);color:var(--cink);font:400 36px/1.2 var(--disp);font:400 clamp(22px,3vw,36px)/1.2 var(--disp);text-align:center;border-radius:16px;padding:12px;margin:10px 0}
.fhead,.frow{display:grid;grid-template-columns:min0 min0 min0;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.fhead{color:var(--mute);font-weight:700;margin-top:14px;padding:0 4px}
.frow{padding:10px 0;border-top:1px solid var(--line);align-items:start}
.fq{font-weight:700;font-size:20px;font-size:clamp(16px,1.6vw,20px);padding-top:10px}
.fq b{color:var(--gold);margin-right:6px}
.fc{display:grid;gap:6px}
.who{display:none;color:var(--mute);font-size:14px;font-weight:500}
.one .fhead,.one .frow{grid-template-columns:min0 min0;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.fcell{min-height:56px;border-radius:12px;background:linear-gradient(180deg,#4a7cff,#2346c9 52%,#16308f);box-shadow:inset 0 0 0 2px #9cc0ff;display:flex;align-items:center;justify-content:space-between;overflow:hidden;color:#fff}
.fcell.on{background:linear-gradient(180deg,#2b3cb0,#17227a)}
.fcell.pop{animation:pts .45s}
.ft{font-weight:800;font-size:24px;font-size:clamp(16px,1.8vw,24px);padding:0 14px;overflow-wrap:anywhere;text-transform:uppercase}
.ft.dim{color:rgba(255,255,255,.55);letter-spacing:4px}
.fpts{font:400 36px var(--disp);font:400 clamp(24px,2.6vw,36px) var(--disp);background:linear-gradient(180deg,#ffe27a,#ffb020);color:#3a1a00;align-self:stretch;display:grid;place-items:center;min-width:2.2em}
.hid{visibility:hidden}
@media(max-width:600px){.fm-top{grid-template-columns:1fr auto}.fm-tot{grid-column:1/-1;text-align:left}.fhead{display:none}.frow,.one .frow{grid-template-columns:min0;grid-template-columns:minmax(0,1fr)}.who{display:block}.fq{padding-top:0}}

/* ---------- textos ---------- */
.doc{max-width:860px;margin:0 auto;padding:40px 4vw 64px;padding:clamp(16px,3vw,40px) max(4vw,16px) 64px}
.doc>*{position:relative}
.doc h2{font:400 50px/1.05 var(--disp);font:400 clamp(34px,4.5vw,50px)/1.05 var(--disp);color:var(--gold);margin-bottom:10px}

.doc li{margin-bottom:8px}

.small{font-size:14px;color:var(--mute)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,min250px);grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.qc{background:var(--panel);border-radius:14px;padding:12px 16px}
.qc h4{font-size:16px;line-height:1.3;margin:0 0 6px}
.qc h4 span{color:var(--gold);margin-right:4px}
.tag{font-style:normal;font-size:12px;font-weight:700;background:var(--pink);color:#fff;border-radius:99px;padding:1px 8px;vertical-align:2px;white-space:nowrap}
.qc ol{margin:0;padding-left:1.3em}
.qc li{margin:0;max-width:none}
.qc li b{float:right;color:var(--pink);margin-left:8px}
details.spoil{margin-top:28px;background:var(--panel);border-radius:14px;padding:4px 16px 12px}
details.spoil summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--gold)}
textarea{min-height:60vh;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}

@media(prefers-reduced-motion:reduce){.logo img.rays,.ltitle,.tcard,.vs,.vs::before,.go::before,.live::after,.team.stealer .spot,.marq canvas.l,.rim canvas.l{animation:none!important}.marq canvas.l1,.rim canvas.l1{opacity:1}.tile .in{transition:none}.ban.on .rib{animation:none;transform:rotate(-7deg)}.qq.run .k i{animation:none;display:none}.qq.run .k span{animation:none;opacity:1}}

@media(prefers-reduced-motion:reduce){.tring .tg{transition:none}.tring .tg,.tring b.pop,.qact .prep{animation:none!important}.buzz .bz,.buzz .mid,.buzz::after{animation:none!important}}

/* ====== escenario que reacciona: reflectores robóticos ====== */
.bgstage .mh{position:absolute;top:-2vh;width:0;height:0;will-change:transform;--bc:#fff}
.bgstage .bm{position:absolute;left:-14vh;top:0;width:28vh;height:116vh;display:block;opacity:.62;pointer-events:none}
.bgstage .mh::before{content:"";position:absolute;left:-1.7vh;top:.6vh;width:3.4vh;height:3.4vh;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--bc) 40%,transparent 70%)}
body.tvmode .bgstage .bm{opacity:.42}
body.ovl .bgstage .mh{visibility:hidden}
/* ====== respuesta correcta: chispas y puntos que vuelan ====== */
#board .tile.rvx{z-index:5}
.spk{position:fixed;z-index:31;width:7px;height:7px;border-radius:50%;pointer-events:none;box-shadow:0 0 8px currentColor}
.fly{position:fixed;z-index:32;padding:6px 14px;border-radius:999px;font:400 34px/1 var(--disp);font:400 clamp(22px,4vmin,34px)/1 var(--disp);pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.fly.gold{background:linear-gradient(180deg,#ffe27a,#ffb020);color:#3a1a00;box-shadow:0 0 0 3px #fff3c4,0 0 26px rgba(255,196,46,.8)}
.fly.teal{background:linear-gradient(180deg,#7ff5e6,#14b8a6);color:#062b27;box-shadow:0 0 0 3px #d9fffa,0 0 26px rgba(63,224,204,.8)}
.fly.n1{font-size:40px;font-size:clamp(26px,5vmin,40px)}
.fly.pink{background:linear-gradient(180deg,#ff7ab8,#ff2e88);color:#fff;box-shadow:0 0 0 3px #ffd6ea,0 0 26px rgba(255,46,136,.8)}
#board .tile:not(.on) .front::after{content:"";position:absolute;top:-20%;right:-60%;bottom:-20%;left:-60%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-70%);animation:glint 7s ease-in-out infinite;animation-delay:calc(var(--gi,0) * .35s)}
@keyframes glint{0%,70%{transform:translateX(-70%)}85%,100%{transform:translateX(70%)}}
/* ====== destapar las que faltan ====== */
#game.rvon #board .tile:not(.aim){filter:brightness(.4) saturate(.6);transition:filter .4s}
#board .tile{transition:filter .4s}
#board .tile.aim{z-index:4;animation:aimg .42s ease-in-out infinite alternate}
@keyframes aimg{from{filter:drop-shadow(0 0 4px #ffd76a) brightness(1.05)}to{filter:drop-shadow(0 0 16px #ffd76a) drop-shadow(0 0 30px #ff9e2e) brightness(1.3)}}
.shcard[hidden]{display:none}
.shcard{position:fixed;left:50%;top:50%;z-index:30;width:680px;width:min(92vw,680px);display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;border-radius:22px;background:linear-gradient(180deg,#3352d8,#1a2690);box-shadow:0 0 0 4px #ffd76a,0 0 0 10px rgba(255,215,106,.25),0 24px 70px rgba(0,0,0,.65),0 0 90px rgba(255,196,46,.45);transform:translate(-50%,-50%);pointer-events:none}
.shcard .sn{display:grid;place-items:center;padding:0 24px;padding:0 clamp(12px,2.6vmin,24px);border-radius:22px 0 0 22px;background:#0b145a;font:400 64px/1 var(--disp);font:400 clamp(32px,7vmin,64px)/1 var(--disp);color:#ffd76a}
.shcard .st{padding:32px 26px;padding:clamp(16px,3.4vmin,32px) clamp(12px,2.6vmin,26px);font:800 54px/1.05 Rubik,sans-serif;font:800 clamp(24px,5.4vmin,54px)/1.05 Rubik,sans-serif;text-transform:uppercase;color:#fff;text-wrap:balance;overflow-wrap:anywhere;align-self:center}
.shcard .sp{display:grid;place-items:center;min-width:2.2em;border-radius:0 22px 22px 0;font:400 72px/1 var(--disp);font:400 clamp(36px,7.6vmin,72px)/1 var(--disp);background:linear-gradient(180deg,#ffe27a,#ffb020);color:#3a1a00}
.shcard .s1{font-style:normal;position:absolute;left:50%;top:-2px;transform:translate(-50%,-100%);padding:6px 18px;border-radius:14px 14px 0 0;background:var(--pink);font:400 26px var(--disp);font:400 clamp(17px,3.4vmin,26px) var(--disp);color:#fff;white-space:nowrap}
/* ====== ruleta: entra, se borra con la velocidad, el gajo ganador brilla y el × explota ====== */
.wheel canvas.wb{opacity:0;will-change:opacity}
#wseg{z-index:2;pointer-events:none;opacity:0}
.wmul{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;display:grid;place-items:center;pointer-events:none;opacity:0}

.wmul b{position:relative;font:400 150px/1 var(--disp);font:400 clamp(70px,20vmin,150px)/1 var(--disp);color:#fff;-webkit-text-stroke:6px #ff2e88;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35),0 0 40px rgba(255,46,136,.8)}
.wmul.x4 b{-webkit-text-stroke-color:#ffb020;text-shadow:0 8px 0 rgba(0,0,0,.35),0 0 50px rgba(255,196,46,.9)}
@media(prefers-reduced-motion:reduce){.bgstage .mh{transform:none!important}#board .tile .front::after,#board .tile.aim,.wmul img{animation:none!important}}


/* ================== LABORATORIO 2 (con el diseño del juego) ================== */

/* avatares */
.l2-opts{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;font-weight:800;font-size:14px}
.l2-opts small{color:var(--mute);font-weight:600;font-size:12px;flex-basis:100%;text-align:center;margin-top:-4px}
.l2-tog{position:relative;width:54px;height:30px;border:0;border-radius:999px;background:#2a3290;box-shadow:inset 0 0 0 2px rgba(156,192,255,.25);transition:background .25s}

.l2-bank small{font-weight:700;color:var(--mute);font-size:12px}
.l2-bank b{font:400 60px/1 var(--disp);font:400 clamp(32px,5.5vw,60px)/1 var(--disp);color:var(--gold)}
.l2-x2{margin-top:2px;padding:1px 10px;border-radius:999px;background:var(--pink);color:#fff;font:400 16px var(--disp);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.l2-x2.on{transform:scale(1)}
/* racha */
.l2-fire{position:absolute;top:-4px;right:-4px;bottom:-4px;left:-4px;border-radius:24px;overflow:hidden;z-index:-2;opacity:0;transition:opacity .4s}
.l2-fire i{position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1;margin:-70% 0 0 -70%;will-change:transform;background:conic-gradient(#ff3d00,#ffb300,#ff6d00,#ffea00,#ff3d00,#ff9100,#ff3d00);animation:spin 1.6s linear infinite}
.l2-team[data-r="3"] .l2-fire,.l2-team[data-r="4"] .l2-fire{opacity:1}
.l2-team[data-r="4"] .l2-fire i{animation-duration:.8s}
.l2-team[data-r="3"],.l2-team[data-r="4"]{box-shadow:0 0 26px rgba(255,120,0,.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.l2-flame{position:absolute;right:-6px;top:-10px;display:flex;align-items:center;gap:2px;padding:3px 9px 3px 6px;border-radius:999px;background:linear-gradient(180deg,#ff8a00,#ff3d00);color:#fff;font:400 16px/1 var(--disp);box-shadow:0 4px 12px rgba(255,80,0,.5);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.l2-team:not([data-r="0"]):not([data-r="1"]) .l2-flame{transform:scale(1)}
.l2-flame span{display:inline-block;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.18) rotate(-6deg)}}
.l2-ember{position:fixed;z-index:31;width:6px;height:6px;border-radius:50%;background:#ffb300;box-shadow:0 0 8px #ff6d00;pointer-events:none}
.l2-smoke{position:fixed;z-index:31;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,rgba(200,200,220,.6),rgba(200,200,220,0) 70%);pointer-events:none}
.l2-pop{position:fixed;z-index:40;padding:6px 16px;border-radius:12px;font:400 32px/1 var(--disp);font:400 clamp(20px,4.2vw,32px)/1 var(--disp);color:#fff;white-space:nowrap;pointer-events:none;background:linear-gradient(180deg,#ff8a00,#ff3d00);box-shadow:0 0 0 3px #fff3c4,0 10px 26px rgba(0,0,0,.45)}
.l2-pop.l2-gd{background:linear-gradient(180deg,#ffe27a,#ffb020);color:var(--cink)}
.l2-pop.l2-pk{background:linear-gradient(180deg,#ff5aa5,#ff2e88)}
/* comodines */
.l2-cmds{display:flex;gap:6px;justify-content:center}
.l2-cmd{position:relative;width:64px;width:clamp(48px,9vw,64px);aspect-ratio:3/4;border:0;padding:0;background:none;perspective:500px}
.l2-cmd .l2-ci{position:absolute;top:0;right:0;bottom:0;left:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.l2-cmd.used .l2-ci{transform:rotateY(180deg)}
.l2-cmd .l2-cf,.l2-cmd .l2-cb{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;align-content:center;gap:2px;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.l2-cmd .l2-cf{background:linear-gradient(180deg,#fff8ec,#ffe9b8);color:var(--cink);box-shadow:inset 0 0 0 2px #ffc42e,0 4px 10px rgba(0,0,0,.35)}
.l2-cmd .l2-cf i{font-style:normal;font:400 26px/1 var(--disp);font:400 clamp(18px,3.6vw,26px)/1 var(--disp)}
.l2-cmd .l2-cf small{font:800 11px Rubik,sans-serif;font:800 clamp(9px,1.6vw,11px) Rubik,sans-serif}
.l2-cmd .l2-cb{transform:rotateY(180deg);background:#232a60;color:#7d84b8;font:800 10px Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(156,192,255,.2)}
.l2-tw.off .l2-cmd:not(.used){filter:grayscale(.6) brightness(.7)}
/* medidor de la encuesta: tablero de 100 foquitos LED */
.l2-meter{margin:0 0 10px;padding:10px 12px 10px;border-radius:16px;background:#0a0d33;box-shadow:inset 0 0 0 2px rgba(156,192,255,.16)}
.l2-mh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font:800 12px Rubik,sans-serif;letter-spacing:.06em;color:var(--mute)}
.l2-mh span b{font:400 24px var(--disp);color:var(--gold);letter-spacing:0}
.l2-led{display:grid;grid-template-columns:repeat(var(--cols,50),min0);grid-template-columns:repeat(var(--cols,50),minmax(0,1fr));gap:3px;padding:6px;border-radius:10px;background:#05071f;box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}
.l2-led i{aspect-ratio:1;border-radius:3px;background:#161b4a;box-shadow:inset 0 0 0 1px rgba(156,192,255,.08)}
.l2-led i.on{background:var(--c);box-shadow:0 0 6px var(--c),inset 0 1px 0 rgba(255,255,255,.55)}
.l2-led i.miss{background:var(--c);opacity:.38;box-shadow:none}
.l2-led i.rest{background:repeating-linear-gradient(-45deg,#3a3f74 0 3px,#2c3166 3px 6px)}
.l2-led.full{box-shadow:inset 0 2px 10px rgba(0,0,0,.8),0 0 0 2px #ffd76a,0 0 22px rgba(255,215,106,.6)}
.l2-leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:4px}
.l2-leg span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:#1e2569;font:800 12px Rubik,sans-serif;text-transform:uppercase}
.l2-leg span i{width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:0 0 6px var(--c)}
.l2-leg span b{font:400 15px var(--disp);color:var(--gold)}
.l2-leg span.miss{opacity:.55}
/* letras de aeropuerto */
.l2-q{margin:0 0 10px;padding:10px 14px;border-radius:16px;background:linear-gradient(180deg,#1b2266,#121746);text-align:center;box-shadow:inset 0 0 0 2px rgba(156,192,255,.2)}
.l2-q small{display:block;color:var(--mute);font-weight:700;font-size:12px}
.l2-q p{margin:2px 0 0;font:800 28px/1.15 Rubik,sans-serif;font:800 clamp(18px,3.6vw,28px)/1.15 Rubik,sans-serif}
#board .back .l2-flw{flex:1;display:flex;flex-wrap:wrap;align-content:center;gap:4px 6px;padding:0 8px}
.l2-w{display:inline-flex;gap:2px}
.l2-c{position:relative;display:grid;place-items:center;min-width:.82em;height:1.32em;padding:0 .06em;border-radius:3px;background:linear-gradient(180deg,#1a2470 50%,#0f1658 50%);color:#fff;font:800 24px/1 Rubik,sans-serif;font:800 clamp(12px,2.1vw,24px)/1 Rubik,sans-serif;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.l2-c::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.65)}
.l2-c i{font-style:normal;display:block}
.ap .l2-c{background:linear-gradient(180deg,#ffe27a 50%,#ffc42e 50%);color:#3a1a00;font-family:var(--disp);font-weight:400;font-size:inherit;min-width:.62em;height:1.2em}
#board .tile .l2-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:2px 8px;border-radius:8px;background:linear-gradient(180deg,#ffe27a,#ffb020);color:#3a1a00;font:400 26px/1.1 var(--disp);font:400 clamp(16px,2.6vw,26px)/1.1 var(--disp);box-shadow:0 0 12px rgba(255,196,46,.8)}
#board .tile.l2-sur .back{background:linear-gradient(120deg,#ffb020,#ffe27a 40%,#ffb020 60%,#ffd24a);background-size:250% 100%;animation:surb 1.6s ease-in-out infinite alternate;box-shadow:inset 0 0 0 2px #fff3c4,0 0 24px rgba(255,196,46,.8)}
#board .tile.l2-sur .back .l2-flw .l2-c{background:linear-gradient(180deg,#3a2400 50%,#2a1a00 50%)}
#board .tile.l2-sur .ap{background:linear-gradient(180deg,#ff5aa5,#ff2e88);color:#fff}
#board .tile.l2-sur .ap .l2-c{background:linear-gradient(180deg,#fff8ec 50%,#ffe3ef 50%);color:#b3105c}
@keyframes surb{to{background-position:100% 0}}
.l2-dot{position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
/* final: medallas */
.l2-win{display:grid;justify-items:center;gap:4px;margin:6px 0 12px}
.l2-win .big{font-size:72px;line-height:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.l2-win b{font:400 48px/1 var(--disp);font:400 clamp(30px,6vw,48px)/1 var(--disp);color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.3)}
.l2-meds{display:grid;gap:10px;max-width:560px;margin:0 auto}
.l2-med{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:linear-gradient(180deg,#1e2569,#141a52);box-shadow:inset 0 0 0 2px rgba(255,214,110,.35),0 10px 24px rgba(0,0,0,.35);overflow:hidden;opacity:0}
.l2-med::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);transform:translateX(-120%)}
.l2-med.on::after{animation:segsh 1s .35s ease-out forwards}
.l2-md{position:relative;width:62px;height:62px;perspective:400px}
.l2-md .rb{position:absolute;left:50%;top:-14px;width:30px;height:26px;margin-left:-15px;background:linear-gradient(90deg,var(--mc) 0 50%,#fff8ec 50%);clip-path:polygon(0 0,100% 0,80% 100%,50% 70%,20% 100%)}
.l2-md .dk{position:absolute;top:6px;right:4px;bottom:0;left:4px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 30%,#fff7cf,#ffc42e 55%,#c98d00);box-shadow:0 0 0 3px #fff3c4,0 6px 14px rgba(0,0,0,.45)}
.l2-mt b{display:block;font:400 24px/1.1 var(--disp);font:400 clamp(18px,3.4vw,24px)/1.1 var(--disp)}
.l2-mt small{color:var(--mute);font-weight:700;font-size:13px}
.l2-mav{font-size:34px}
/* foto */
.l2-cam{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(4,6,24,.96)}
.l2-view{position:relative;width:540px;width:min(94vw,calc((100dvh - 150px) * .75),540px);aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#000}
.l2-view video,.l2-view img,.l2-view canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.l2-view video.mir{transform:scaleX(-1)}
.l2-count{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font:400 120px/1 var(--disp);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.4);pointer-events:none}
.l2-flash{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;opacity:0;pointer-events:none}
.l2-cmsg{max-width:420px;text-align:center;color:var(--mute);font-weight:600;font-size:14px}
/* sonidos */
.l2-sg{margin:0 0 12px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#1b2266,#121746);box-shadow:inset 0 0 0 2px rgba(156,192,255,.16)}
.l2-sg h3{margin:0;font:400 21px var(--disp)}
.l2-sg p{margin:2px 0 8px;color:var(--mute);font-size:13px;font-weight:600}
.l2-so{display:grid;grid-template-columns:repeat(auto-fill,min150px);grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.l2-s{position:relative;display:flex;align-items:center;gap:8px;padding:11px 12px;border:0;border-radius:12px;background:#2a3290;color:#fff;font:800 14px Rubik,sans-serif;text-align:left;box-shadow:0 4px 0 #161b5e}
.l2-s::before{content:"▶";display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.14);font-size:10px}
.l2-s[aria-pressed=true]{background:linear-gradient(180deg,#ffe27a,#ffb020);color:var(--cink);box-shadow:0 4px 0 #b77c00}
.l2-s[aria-pressed=true]::after{content:"★";position:absolute;right:8px;top:5px;font-size:12px}
.l2-s small{display:block;font-weight:600;font-size:11px;opacity:.75}
@media (max-width:520px){.l2-score{grid-template-columns:1fr 1fr}.l2-bank{grid-column:1/-1;grid-row:2;flex-direction:row}.l2-team{grid-template-columns:auto 1fr}}
@media (prefers-reduced-motion:reduce){.l2-fire i,.l2-flame span,.l2-seg::after{animation:none}}

/* ================== LABORATORIO 3 · arranque de la ronda ================== */
.l3-wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:8px 12px 70px}
.l3-h{margin:4px 0 8px;text-align:center;font:400 40px/1 var(--disp);font:400 clamp(26px,5.5vw,40px)/1 var(--disp)}
.l3-h2{margin:26px 0 10px;text-align:center;font:400 32px/1 var(--disp);font:400 clamp(22px,4.5vw,32px)/1 var(--disp)}
.l3-tip{margin:6px 0 0;text-align:center;color:var(--mute);font-size:12px;font-weight:600}
.l3-note{max-width:620px;margin:10px auto 0;text-align:center;color:var(--mute);font-size:13px;font-weight:600;min-height:1.3em}

/* pasos */
.l3-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding:0;list-style:none;counter-reset:none}
.l3-steps button{position:relative;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border:0;border-radius:12px;background:#1e2569;color:var(--mute);font:800 15px Rubik,sans-serif;font:800 clamp(12px,2.6vw,15px) Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(156,192,255,.18);transition:background .25s,color .25s,box-shadow .25s}
.l3-steps b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);font:400 13px/1 var(--disp);color:#fff;flex:none}
.l3-steps button.done{color:#bff7ee}
.l3-steps button.done b{background:#14b8a6}
.l3-steps button[aria-current=step]{background:linear-gradient(180deg,#ffe27a,#ffb020);color:var(--cink);box-shadow:0 0 0 2px #fff3c4,0 6px 18px rgba(255,196,46,.35)}
.l3-steps button[aria-current=step] b{background:var(--cink);color:#ffe27a}

/* barra de la ronda */
.l3-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px;margin:12px 0 8px;padding-right:96px}
.l3-rnd{padding:6px 12px;border-radius:999px;background:#1e2569;font:800 14px Rubik,sans-serif;color:var(--mute);box-shadow:inset 0 0 0 2px rgba(156,192,255,.18)}
.l3-rnd b{font:400 18px var(--disp);color:#fff}
.l3-mult{padding:5px 12px;border-radius:999px;background:linear-gradient(180deg,#ff5aa5,#ff2e88);font:800 14px Rubik,sans-serif;box-shadow:0 0 14px rgba(255,46,136,.5)}
.l3-mult b{font:400 20px var(--disp)}
.l3-mult.x4{background:linear-gradient(180deg,#ffe27a,#ffb020);color:var(--cink);box-shadow:0 0 16px rgba(255,196,46,.7)}
.l3-turn{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--tcol,#3fe0cc);color:var(--cink);font:700 14px Rubik,sans-serif;box-shadow:0 0 0 2px #fff,0 0 16px var(--tcol)}
.l3-turn i{display:block;width:34px;height:34px;border-radius:50%;font-style:normal}
.l3-turn b{font:400 17px var(--disp)}

/* tablero de la pregunta: letras de aeropuerto */
.l3-qp{position:relative;margin:0 0 14px;padding:12px 12px 14px;border-radius:20px;background:linear-gradient(180deg,#0b0f3a,#070a28);box-shadow:0 0 0 3px #ffd76a,0 0 0 6px #6b3f00,0 10px 30px rgba(0,0,0,.55),inset 0 0 30px rgba(0,0,0,.6);overflow:visible}
.l3-qhead{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 7px;min-height:1.4em;margin:0 0 10px;font-size:15px;font-size:clamp(11px,2.2vw,15px)}
.l3-qhead .l2-c{background:linear-gradient(180deg,#3a2400 50%,#2a1a00 50%);color:#ffd76a;font-size:inherit;height:1.35em;min-width:.85em}
.l3-qb{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:.32em .5em;min-height:4.6em;padding:0 4px;font-size:36px;font-size:clamp(19px,4.1vw,36px)}
.l3-qb .l2-c{font-size:inherit;height:1.36em;min-width:.86em;border-radius:4px;background:linear-gradient(180deg,#1c2678 50%,#111a62 50%);box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 0 0 1px rgba(156,192,255,.12)}
.l3-qb .l2-c.bl{background:linear-gradient(180deg,#141b55 50%,#0d1348 50%)}
.l3-qb .l2-w{gap:3px}
.l3-shine{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:20px;overflow:hidden;pointer-events:none}
.l3-shine::before{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22) 45%,rgba(255,240,180,.35) 50%,transparent 60%);transform:translateX(-120%);opacity:0}
.l3-qp.lit .l3-shine::before{animation:l3shine 1s ease-out}
@keyframes l3shine{0%{transform:translateX(-120%);opacity:1}100%{transform:translateX(300%);opacity:1}}
.l3-stamp{position:absolute;left:50%;top:50%;z-index:9;padding:.1em .45em;border-radius:14px;background:#ff2d4d;color:#fff;font:400 76px/1.05 var(--disp);font:400 clamp(34px,9vw,76px)/1.05 var(--disp);letter-spacing:.02em;box-shadow:0 0 0 5px #fff,0 0 40px rgba(255,45,77,.9);pointer-events:none;opacity:0;transform:translate(-50%,-50%) rotate(-8deg)}

/* reloj: 15 foquitos, uno por segundo; en los últimos 5 crece */
.l3-clk{position:absolute;right:-2px;top:-64px;width:82px;height:82px;padding:0;border:0;background:none;z-index:8;cursor:pointer;--tc:#ffc42e;-webkit-tap-highlight-color:transparent}
.l3-cg{position:absolute;top:0;right:0;bottom:0;left:0;scale:var(--g,1);transform-origin:94% 18%;will-change:transform;transition:scale .45s cubic-bezier(.3,1.5,.5,1)}
.l3-crown{position:absolute;left:50%;top:-2%;width:20%;height:13%;margin-left:-10%;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#fff0a8,#c98a00);box-shadow:0 2px 0 #6b3f00}
.l3-side{position:absolute;right:9%;top:9%;width:13%;height:10%;border-radius:3px;background:linear-gradient(180deg,#fff0a8,#c98a00);transform:rotate(45deg)}
.l3-cface{position:absolute;top:9%;right:9%;bottom:9%;left:9%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#222c80,#0a0e3a 72%);box-shadow:0 0 0 3px #ffd76a,0 0 0 6px #7a4b00,0 6px 16px rgba(0,0,0,.6),inset 0 0 14px rgba(0,0,0,.8)}
.l3-bulbs{position:absolute;top:0;right:0;bottom:0;left:0}
.l3-bulbs i{position:absolute;left:50%;top:50%;width:7.5%;height:7.5%;margin:-3.75% 0 0 -3.75%;border-radius:50%;background:var(--tc);box-shadow:0 0 6px var(--tc);transform:rotate(calc((var(--k) + .5)*24deg)) translateY(-440%);transition:opacity .15s,background .3s,box-shadow .3s}
.l3-bulbs i.off{opacity:.13;box-shadow:none}
.l3-chand{position:absolute;left:50%;top:22%;width:3%;height:28%;margin-left:-1.5%;border-radius:2px;background:linear-gradient(180deg,var(--tc),rgba(255,255,255,.2));transform-origin:50% 100%;opacity:.8;transition:rotate .28s cubic-bezier(.3,1.9,.45,1)}
.l3-cn{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font:400 30px/1 var(--disp);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);transition:color .3s}
.l3-cs{position:absolute;left:0;right:0;bottom:24%;text-align:center;font:800 9px/1 Rubik,sans-serif;font-style:normal;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.l3-clk.idle .l3-cn{color:#ffd76a;font-size:26px;transform:translateY(-3px)}
.l3-clk:not(.idle) .l3-cs{opacity:0}
.l3-clk.hot[data-l="5"],.l3-clk.hot[data-l="4"]{--tc:#ffc42e}
.l3-clk.hot[data-l="3"]{--tc:#ff8a1a}
.l3-clk.hot[data-l="2"],.l3-clk.hot[data-l="1"]{--tc:#ff3355}
.l3-clk.hot .l3-cface,.l3-clk.out .l3-cface{box-shadow:0 0 0 3px #ffd76a,0 0 0 6px #7a4b00,0 0 16px 6px var(--tc),0 0 38px 10px var(--tc),inset 0 0 14px rgba(0,0,0,.8)}
.l3-clk.hot .l3-cn{color:var(--tc)}
.l3-clk.hot[data-l="2"] .l3-cg,.l3-clk.hot[data-l="1"] .l3-cg{animation:l3twig .14s ease-in-out infinite alternate}
@keyframes l3twig{from{rotate:-4deg}to{rotate:4deg}}
.l3-clk.out{--tc:#ff3355}
.l3-clk.out .l3-cn{color:#ff3355;font-size:22px}
.l3-clk.ok{--tc:#35e08a}
.l3-clk.ok .l3-cn{color:#35e08a}
.l3-cn.pop{animation:l3pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes l3pop{0%{transform:scale(1.9)}100%{transform:scale(1)}}
.l3-hotv{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;pointer-events:none;opacity:0;box-shadow:inset 0 0 90px 30px rgba(255,40,70,.75)}
.l3-xbig{position:fixed;left:50%;top:50%;z-index:45;display:grid;place-items:center;width:260px;width:min(44vmin,260px);aspect-ratio:1;margin:calc(260px/-2) 0 0 calc(260px/-2);margin:calc(min(44vmin,260px)/-2) 0 0 calc(min(44vmin,260px)/-2);border-radius:28px;background:linear-gradient(180deg,#ff4d6a,#d40f35);color:#fff;font:400 200px/1 var(--disp);font:400 min(34vmin,200px)/1 var(--disp);box-shadow:0 0 0 6px #fff,0 0 60px rgba(255,40,70,.9);pointer-events:none;opacity:0}

/* controles */
.l3-ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 0}
.l3-ctl .l2-b{font-size:16px;padding:13px 18px}
.l3-ctl .l2-b.big{font-size:19px;padding:16px 28px}
.l3-ctl .l2-b.l3-x{background:linear-gradient(180deg,#ff5a76,#e0123d);box-shadow:0 4px 0 #8f0a26}

/* ===================== RULETA ===================== */
.l3-wov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:radial-gradient(60% 50% at 50% 46%,rgba(46,56,170,.6),rgba(3,5,22,.95));touch-action:none;user-select:none;-webkit-user-select:none;--ws:560px;--ws:min(88vw,58vh,560px)}
.l3-wt{margin:0;font:400 44px/1 var(--disp);font:400 clamp(26px,5.5vw,44px)/1 var(--disp);text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 24px rgba(255,196,46,.5)}
.l3-wst{position:relative;width:var(--ws);height:var(--ws);flex:none;cursor:grab;touch-action:none}
.l3-wst:active{cursor:grabbing}
.l3-rim{position:absolute;top:0;right:0;bottom:0;left:0}
.l3-rim canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.l3-rim canvas.l{opacity:.3;transition:opacity .12s}
.l3-rim[data-ph="0"] .l1,.l3-rim[data-ph="1"] .l2,.l3-rim[data-ph="2"] .l3,.l3-rim[data-ph="all"] .l{opacity:1}
.l3-wsw{position:absolute;top:7%;right:7%;bottom:7%;left:7%;border-radius:50%}
.l3-wsw.sway{animation:l3sway 2.6s ease-in-out infinite}
@keyframes l3sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.l3-wspin{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;will-change:transform;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 10px 30px rgba(0,0,0,.5)}
.l3-wspin canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border-radius:50%}
#wbl{opacity:0}
#wglow{opacity:0}
.l3-ptr{position:absolute;left:50%;top:-4.5%;width:11%;margin-left:-5.5%;z-index:3;transform-origin:50% 27%;filter:drop-shadow(0 5px 6px rgba(0,0,0,.55));overflow:visible}
.l3-arc{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;pointer-events:none;animation:l3arc 2.4s cubic-bezier(.45,0,.3,1) infinite}
.l3-arc span{position:absolute;right:2%;top:30%;font-size:60px;font-size:clamp(34px,8vw,60px);transform:rotate(-30deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
@keyframes l3arc{0%{rotate:-70deg;opacity:0}15%{opacity:1}70%{rotate:35deg;opacity:1}85%,100%{rotate:45deg;opacity:0}}
.l3-arc[hidden]{display:none}
.l3-med{position:absolute;left:50%;top:50%;z-index:5;width:44%;aspect-ratio:1;margin:-22% 0 0 -22%;display:grid;place-items:center;pointer-events:none;opacity:0}
.l3-med b{position:relative;display:grid;place-items:center;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 30%,#ff8ac2,#ff2e88 55%,#a10a52);color:#fff;font:400 calc(var(--ws)*.13)/1 var(--disp);text-shadow:0 3px 0 rgba(0,0,0,.35);box-shadow:0 0 0 5px #fff3c4,0 0 0 9px #d98a00,0 0 40px rgba(255,46,136,.8)}
.l3-med.x4 b{background:radial-gradient(circle at 38% 30%,#fff3b0,#ffc42e 55%,#c27c00);color:#5a2a00;text-shadow:none;box-shadow:0 0 0 5px #fff,0 0 0 9px #ff2e88,0 0 50px rgba(255,196,46,.95)}
.l3-med.x1 b{background:radial-gradient(circle at 38% 30%,#7fb0ff,#2f80ff 55%,#1645a8);box-shadow:0 0 0 5px #fff3c4,0 0 0 9px #d98a00,0 0 30px rgba(47,128,255,.7)}
.l3-rays{position:absolute;top:-30%;right:-30%;bottom:-30%;left:-30%;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,150,.55) 0 9deg,transparent 9deg 22.5deg);-webkit-mask:radial-gradient(circle,transparent 24%,#000 34%,transparent 71%);mask:radial-gradient(circle,transparent 24%,#000 34%,transparent 71%);animation:l3spin 7s linear infinite}
.l3-rays.r2{top:-15%;right:-15%;bottom:-15%;left:-15%;background:repeating-conic-gradient(rgba(255,255,255,.35) 0 4deg,transparent 4deg 15deg);animation-duration:11s;animation-direction:reverse}
@keyframes l3spin{to{rotate:360deg}}
.l3-wres{min-height:1.3em;margin:0;text-align:center;font:400 36px/1.15 var(--disp);font:400 clamp(22px,4.6vw,36px)/1.15 var(--disp)}
.l3-wbtns{display:flex;gap:10px;min-height:52px}
.l3-wbtns .l2-b{font-size:17px;padding:13px 22px}

/* ===================== BOTONES ===================== */
.l3-bz{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;display:grid;grid-template-columns:1fr 1fr;background:#03041a;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.l3-half{position:relative;min-height:0;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.l3-half.h0{--tc:#3fe0cc;--tl:#a8fff3;--td:#0b6f64;--tdd:#053d37;background:radial-gradient(circle at 50% 58%,#12706a,#06343a 60%,#031419)}
.l3-half.h1{--tc:#ffc42e;--tl:#fff0a8;--td:#b77c00;--tdd:#5a3a00;background:radial-gradient(circle at 50% 58%,#7a5400,#3a2600 60%,#170e00)}
.l3-half::before{content:"";position:absolute;top:-50%;right:-50%;bottom:-50%;left:-50%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 26px,transparent 26px 70px);animation:l3str 6s linear infinite;pointer-events:none}
@keyframes l3str{to{transform:translateX(70px)}}
.l3-half::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:2;background:#02030f;opacity:0;transition:opacity .3s;pointer-events:none}
.l3-half.lose::after{opacity:.62}
.l3-bz.wait .l3-bn{opacity:.7}
.l3-half.win::after{opacity:0}
.l3-half.win{background:radial-gradient(circle at 50% 55%,var(--tl),var(--tc) 40%,var(--td))}
.l3-hin{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;gap:clamp(6px,1.6vmin,14px);padding:28px;padding:clamp(12px,3vmin,28px);text-align:center}
.l3-bq{margin:0;max-width:30ch;font:800 19px/1.25 Rubik,sans-serif;font:800 clamp(13px,2.4vmin,19px)/1.25 Rubik,sans-serif;color:rgba(255,255,255,.88)}
.l3-bq:empty{display:none}
.l3-dome{position:relative;display:block;width:270px;width:min(44vmin,270px);aspect-ratio:1;flex:none}
.l3-base{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:radial-gradient(circle at 50% 35%,#f4f6ff,#9aa3c8 45%,#3e4570 75%,#20244a);box-shadow:0 14px 0 #10122e,0 20px 30px rgba(0,0,0,.6),inset 0 -6px 10px rgba(0,0,0,.4)}
.l3-cap{position:absolute;top:10%;right:10%;bottom:10%;left:10%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 28%,#fff 0 5%,var(--tl) 9%,var(--tc) 42%,var(--td) 80%,var(--tdd));box-shadow:0 12px 0 var(--tdd),0 14px 18px rgba(0,0,0,.45),inset 0 -10px 18px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s,filter .2s}
.l3-cap::after{content:"";position:absolute;left:18%;top:9%;width:46%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));transform:rotate(-18deg);pointer-events:none}
.l3-av{position:relative;display:block;width:68%;aspect-ratio:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.l3-ring{position:absolute;top:6%;right:6%;bottom:6%;left:6%;border-radius:50%;border:5px solid var(--tc);opacity:0;pointer-events:none}
.l3-bz.l3-go .l3-half:not(.lose):not(.win) .l3-ring{animation:l3ring 1s ease-out infinite}
.l3-bz.l3-go .l3-half:not(.lose):not(.win) .l3-ring.r2{animation-delay:.5s}
@keyframes l3ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.l3-bz.wait .l3-cap{filter:saturate(.35) brightness(.75)}
.l3-half.early .l3-cap{filter:grayscale(1) brightness(.6)}
.l3-half.press .l3-cap,.l3-half.win .l3-cap{transform:translateY(10px);box-shadow:0 2px 0 var(--tdd),0 4px 8px rgba(0,0,0,.4),inset 0 -6px 14px rgba(0,0,0,.3)}
.l3-half.win .l3-cap{filter:brightness(1.15)}
.l3-bn{font:400 46px/1 var(--disp);font:400 clamp(26px,5.5vmin,46px)/1 var(--disp);color:var(--tc);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.l3-half.win .l3-bn{color:#fff}
.l3-bs{font:800 18px Rubik,sans-serif;font:800 clamp(13px,2.4vmin,18px) Rubik,sans-serif;color:rgba(255,255,255,.75)}
.l3-half.early .l3-bs{color:#ff8fa3}
.l3-half.win .l3-bs{margin-top:4px;color:#fff;font:400 34px/1 var(--disp);font:400 clamp(20px,4vmin,34px)/1 var(--disp)}
/* semáforo */
.l3-sem{position:absolute;left:50%;top:50%;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translate(-50%,-50%);pointer-events:none}
.l3-lamps{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:22px;background:linear-gradient(180deg,#1a1d33,#0a0c1c);box-shadow:0 0 0 3px #2c3152,0 10px 24px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.08)}
.l3-lamps i{width:52px;width:clamp(30px,6vmin,52px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a1218,#1a070b);box-shadow:inset 0 3px 6px rgba(0,0,0,.8);transition:background .06s,box-shadow .06s}
.l3-lamps i.r{background:radial-gradient(circle at 40% 35%,#ffb3bc,#ff2d3d 45%,#a3001a);box-shadow:0 0 16px #ff2d3d,0 0 40px rgba(255,45,61,.6)}
.l3-lamps i.g{background:radial-gradient(circle at 40% 35%,#d9ffe5,#35ff7a 45%,#00992e);box-shadow:0 0 18px #35ff7a,0 0 50px rgba(53,255,122,.7)}
.l3-lamps i.t{background:radial-gradient(circle at 40% 35%,#fff,var(--wc) 50%);box-shadow:0 0 18px var(--wc),0 0 46px var(--wc)}
.l3-sem b{padding:.2em .7em;border-radius:999px;background:#0b0f3a;color:#fff;font:400 30px/1.1 var(--disp);font:400 clamp(18px,3.6vmin,30px)/1.1 var(--disp);white-space:nowrap;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.6)}
.l3-bz.l3-go .l3-sem b{background:linear-gradient(180deg,#5dff94,#18c454);color:#03361a;font-size:54px;font-size:clamp(28px,6vmin,54px)}
.l3-sem b.wn{background:var(--wc);color:var(--cink)}
.l3-bz::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
.l3-bz.flash::after{animation:l3flash .5s ease-out}
@keyframes l3flash{0%{opacity:.55}100%{opacity:0}}
.l3-bzx{position:absolute;right:10px;top:10px;z-index:6;width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font:800 18px Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.l3-tm{position:absolute;z-index:6;padding:4px 12px;border-radius:999px;background:#fff8ec;color:var(--cink);font:800 15px Rubik,sans-serif;white-space:nowrap;pointer-events:none;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.l3-spk{position:fixed;z-index:80;width:9px;height:9px;border-radius:50%;pointer-events:none}
/* celular parado: un equipo arriba (volteado) y otro abajo */
@media (max-aspect-ratio:3/4){
  .l3-bz{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .l3-half.h0 .l3-hin{transform:rotate(180deg)}
  .l3-lamps{flex-direction:row}
  .l3-sem{flex-direction:row}
  .l3-dome{width:240px;width:min(36vh,52vw,240px)}
}

/* tablero de sonidos */
.l3-sb .l2-sg h3{font-size:19px}

@media (prefers-reduced-motion:reduce){.l3-half::before,.l3-ring,.l3-rays,.l3-arc,.l3-wsw.sway,.l3-clk .l3-cg{animation:none!important}}

.conf{z-index:90}

/* regla de adelantarse */
.l3-rule{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:8px 0 0;font:700 12px Rubik,sans-serif;color:var(--mute)}
.l3-rule button{padding:6px 11px;border:0;border-radius:999px;background:#1e2569;color:var(--mute);font:800 12px Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(156,192,255,.18)}
.l3-rule button[aria-pressed=true]{background:#fff8ec;color:var(--cink);box-shadow:0 0 0 2px #ffd76a}
.l3-rx{padding:5px 11px;border-radius:999px;background:#0b0f3a;color:#ffd76a;font:800 13px Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(255,215,106,.35)}
/* se adelantó */
.l3-fs{position:absolute;left:50%;top:50%;z-index:4;margin:0;padding:.12em .5em;border-radius:14px;background:#ff2d4d;color:#fff;font:400 46px/1.05 var(--disp);font:400 clamp(20px,4.3vw,46px)/1.05 var(--disp);white-space:nowrap;box-shadow:0 0 0 4px #fff,0 0 34px rgba(255,45,77,.9);translate:-50% -50%;opacity:0;pointer-events:none}
.l3-half.l3-foul{background:radial-gradient(circle at 50% 55%,#7a1024,#3a0612 60%,#14020a)}
.l3-half.l3-foul .l3-cap{filter:grayscale(1) brightness(.55);transform:translateY(10px);box-shadow:0 2px 0 var(--tdd)}
.l3-half.l3-foul .l3-bn{color:#ff8fa3}
.l3-half.l3-foul .l3-bs{color:#ffd0d8}
.l3-sem b.l3-fl{background:#ff2d4d;color:#fff;font-size:48px;font-size:clamp(26px,5.5vmin,48px)}
/* foto finish */
.l3-card{position:absolute;left:50%;bottom:4vh;--cy:0px;z-index:5;width:380px;width:min(92vw,380px);padding:12px 14px 10px;border-radius:18px;background:linear-gradient(180deg,#141a5c,#0a0e3a);box-shadow:0 0 0 3px #ffd76a,0 14px 40px rgba(0,0,0,.7);transform:translate(-50%,var(--cy));text-align:center;pointer-events:none}
.l3-card .l3-ct{display:block;margin:0 0 8px;font:400 18px/1 var(--disp);color:#ffd76a;letter-spacing:.04em}
.l3-lane{display:grid;grid-template-columns:7.6em 1fr 4.2em;align-items:center;gap:8px;margin:5px 0;font:800 13px Rubik,sans-serif;text-align:left}
.l3-lane span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3-lane i{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.l3-lane em{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),#fff);transform-origin:0 50%;transform:scaleX(var(--w))}
.l3-lane em.nt{background:repeating-linear-gradient(-45deg,#3a3f74 0 5px,#2c3166 5px 10px)}
.l3-lane b{font:400 17px var(--disp);text-align:right;color:#fff}
.l3-card .l3-cbig{margin:2px 0 6px;font:800 15px/1.3 Rubik,sans-serif}
.l3-card .l3-cbig b{font:400 22px var(--disp);color:#ff8fa3}
.l3-card .l3-cv{margin:8px 0 2px;font:400 22px/1.15 var(--disp);color:#fff}
.l3-rec,.l3-rc{display:block;margin-top:4px;font:800 13px Rubik,sans-serif}
.l3-rec{color:#ffd76a}
.l3-rc{color:var(--mute)}
.l3-card small{display:block;margin-top:4px;color:var(--mute);font:700 11px Rubik,sans-serif}
@media (max-aspect-ratio:3/4){.l3-card{top:50%;bottom:auto;--cy:-50%}}
.l3-half.l3-foul.lose::after{opacity:.2}
@media (max-aspect-ratio:3/4){.l3-fs{font-size:40px;font-size:clamp(22px,6.5vw,40px)}}

/* animalitos (SVG) */
.l3-svg{display:block;width:100%;height:100%;clip-path:circle(50%)}

.l3-avw{display:block;width:62px;width:min(62px,100%);aspect-ratio:1;border-radius:50%;transition:transform .2s}
.l3-avg button.l3-mine{color:#fff}

.l3-avg button:active .l3-avw{transform:scale(.92)}
.l3-arc span svg{display:block;width:58px;width:clamp(36px,8vw,58px);height:auto}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

/* ===== foto finish: carrera de caballos (galope, polvo, cerca y meta) ===== */
.hr{--hw:46px;position:relative;display:grid;gap:3px;margin:4px 0;padding:17px 8px 7px;border-radius:14px;overflow:hidden;text-align:left;color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 26%,transparent 80%,rgba(0,0,0,.25)),repeating-linear-gradient(90deg,#24813f 0 34px,#2b9049 34px 68px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
/* la cerca de arriba */
.hr::before{content:"";position:absolute;left:0;right:0;top:3px;height:11px;pointer-events:none;opacity:.9;
  background:linear-gradient(#fff,#fff) 0 1px/100% 2px no-repeat,linear-gradient(#fff,#fff) 0 6px/100% 2px no-repeat,repeating-linear-gradient(90deg,#f4f1ea 0 3px,transparent 3px 24px);filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.hr-lane{position:relative;display:grid;grid-template-columns:min0 1fr 5.4em;grid-template-columns:minmax(0,6.2em) 1fr 5.4em;align-items:center;gap:6px;min-height:calc(var(--hw)*.8);font:800 13px/1.1 Rubik,sans-serif}
.hr-nm{display:flex;align-items:center;gap:5px;min-width:0;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hr-nm>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hr-av{flex:none;width:22px;height:22px}
.hr-trk{position:relative;height:calc(var(--hw)*.7);border-bottom:2px dashed rgba(255,255,255,.3);background:linear-gradient(180deg,transparent 55%,rgba(120,80,30,.35) 55%,rgba(150,100,40,.45))}
.hr-gate{position:absolute;left:-2px;top:-3px;bottom:-1px;width:7px;border-radius:2px;background:repeating-linear-gradient(180deg,#e6e9ff 0 4px,#9aa3d9 4px 8px);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.hr-go{position:absolute;left:0;top:0;bottom:0;right:var(--hw)}
.hr-tr{position:absolute;left:0;bottom:6px;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--c));opacity:.75}
.hr-run{position:absolute;left:100%;bottom:0;width:var(--hw);height:calc(var(--hw)*.66);color:var(--c)}
.hr-h{position:absolute;top:auto;right:0;bottom:0;left:0;width:var(--hw);height:calc(var(--hw)*.625);overflow:visible}
.hr-jk{position:absolute;left:calc(var(--hw)*.33);top:calc(var(--hw)*-.24);width:calc(var(--hw)*.4);height:calc(var(--hw)*.4);border-radius:50%;z-index:2}
.hr-avj{width:100%;height:100%;display:block}
/* galope: 4 cuadros; parado: patas derechas */
.hr-f{opacity:0}.hr-f.fs{opacity:1}
.hr.run .hr-lane:not(.fin) .hr-f.fs{opacity:0}
.hr.run .hr-lane:not(.fin) .hr-f.f1{animation:hrF .36s steps(1) infinite}
.hr.run .hr-lane:not(.fin) .hr-f.f2{animation:hrF .36s steps(1) infinite -.27s}
.hr.run .hr-lane:not(.fin) .hr-f.f3{animation:hrF .36s steps(1) infinite -.18s}
.hr.run .hr-lane:not(.fin) .hr-f.f4{animation:hrF .36s steps(1) infinite -.09s}
@keyframes hrF{0%{opacity:1}25%,100%{opacity:0}}
.hr.run .hr-lane:not(.fin) .hr-h{animation:hrBob .36s linear infinite}
@keyframes hrBob{0%{transform:translateY(-1px)}25%{transform:translateY(0)}50%{transform:translateY(-3px) rotate(-2deg)}75%{transform:translateY(1px)}100%{transform:translateY(-1px)}}
.hr-tail{transform-origin:21px 21px;transform-box:view-box}
.hr.run .hr-lane:not(.fin) .hr-tail{animation:hrTail .36s ease-in-out infinite alternate}
@keyframes hrTail{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.hr.run .hr-lane:not(.fin) .hr-jk{animation:hrJk .36s ease-in-out infinite}
@keyframes hrJk{50%{transform:translateY(-2px) rotate(-4deg)}}
/* polvo detrás de las patas */
.hr-dust{position:absolute;left:-2px;bottom:0;width:10px;height:10px;opacity:0}
.hr-dust::before,.hr-dust::after{content:"";position:absolute;left:0;bottom:0;width:10px;height:10px;border-radius:50%;background:rgba(222,196,150,.85)}
.hr.run .hr-lane:not(.fin) .hr-dust{opacity:1}
.hr.run .hr-lane:not(.fin) .hr-dust::before{animation:hrDust .54s ease-out infinite}
.hr.run .hr-lane:not(.fin) .hr-dust::after{animation:hrDust .54s ease-out infinite -.27s}
@keyframes hrDust{0%{transform:translate(4px,0) scale(.3);opacity:.9}100%{transform:translate(-16px,-8px) scale(1.7);opacity:0}}
/* la meta */
.hr-meta{position:absolute;right:0;top:-4px;bottom:-3px;width:8px;background:repeating-conic-gradient(#fff 0 25%,#1a1a1a 0 50%) 0 0/8px 8px;box-shadow:0 0 6px rgba(255,255,255,.5)}
.hr-lane:first-child .hr-meta::before{content:"🏁";position:absolute;top:-17px;left:-6px;font-size:15px;line-height:1}
.hr-t{display:flex;align-items:baseline;justify-content:flex-end;gap:3px;white-space:nowrap;font:400 17px/1 var(--disp,inherit);opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hr-t em{font:800 11px Rubik,sans-serif;font-style:normal;color:#ffd76a}
.hr-lane.fin .hr-t{opacity:1;transform:none}
.hr-lane.still .hr-t{transition:none}
.hr-lane:first-child.fin .hr-t em{color:#fff;background:#ffb020;padding:1px 5px;border-radius:99px}
.hr-lane:first-child.fin .hr-jk::after{content:"👑";position:absolute;left:50%;top:-62%;font-size:calc(var(--hw)*.3);line-height:1;transform:translateX(-50%)}
.hr-flash{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;opacity:0;pointer-events:none}
.hr.flash .hr-flash{animation:hrfl .5s ease-out}
@keyframes hrfl{0%{opacity:.5}100%{opacity:0}}
/* cámara lenta */
.hr-slowt{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:3;padding:3px 10px;border-radius:99px;background:#0b0f3a;color:#ffd76a;font:800 12px Rubik,sans-serif;letter-spacing:.06em;opacity:0;pointer-events:none;transition:opacity .2s}
.hr.slow{box-shadow:inset 0 0 0 2px #ffd76a,inset 0 0 40px rgba(0,0,0,.65)}
.hr.slow .hr-slowt{opacity:1;animation:hrRec .5s steps(1) infinite}.hr.photo .hr-slowt{opacity:0!important}
@keyframes hrRec{50%{color:#ff4d6d}}
.hr.slow .hr-lane{filter:saturate(1.25) contrast(1.05)}
.hr-photo{position:absolute;left:50%;top:50%;z-index:4;padding:4px 12px;border-radius:99px;background:#ff2e88;color:#fff;font:400 18px var(--disp,inherit);white-space:nowrap;opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(.4);pointer-events:none}
.hr.photo .hr-photo{animation:hrph 1.8s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes hrph{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1.1)}80%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}}
/* ¡arre! */
.hr-cheer{position:absolute;left:50%;top:-14px;z-index:3;padding:1px 6px;border-radius:99px;background:#fff;color:#2b1840;font:800 11px Rubik,sans-serif;font-style:normal;white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:reduce){.hr *{animation:none!important}}
.lite .hr-dust{display:none!important}.lite .hr-tail,.lite .hr-jk{animation:none!important}
.hr-lane.me{border-radius:10px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px #ffd76a}

.ctk{--s:40px;--k1:#ffe680;--k2:#ef9200;--kg:255,186,40;position:relative;display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:none;color:#fff;font:inherit;text-align:left;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
