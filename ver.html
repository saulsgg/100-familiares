  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75) 0 7%,transparent 8%),radial-gradient(circle at 42% 34%,var(--k1),var(--k2) 74%);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.45);transition:transform .7s cubic-bezier(.3,1.25,.5,1),filter .45s}
.ctk-d svg{width:60%;height:60%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.ctk-t{display:grid;gap:1px;line-height:1.05;white-space:nowrap}
.ctk-t b{font:400 16px var(--disp,Rubik),sans-serif}
.ctk-t small{color:rgb(var(--kg));font:800 10px Rubik,sans-serif;letter-spacing:.05em;text-transform:uppercase}
button.ctk{cursor:pointer}
button.ctk:active .ctk-d{transform:scale(.88)}
/* se puede usar ahora: brilla */
.ctk.can .ctk-d{animation:ctkg 1.3s ease-in-out infinite}
@keyframes ctkg{0%,100%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px #fff,0 0 0 0 rgba(var(--kg),0),0 3px 8px rgba(0,0,0,.45)}
  50%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px #fff,0 0 0 6px rgba(var(--kg),.35),0 0 18px 5px rgba(var(--kg),.75)}}
/* ya se usó: se voltea, queda gris y tachada */
.ctk.used .ctk-d{transform:rotateY(360deg);filter:grayscale(1) brightness(.5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.ctk.used .ctk-d::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:#ff4d66;transform:rotate(-42deg);box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.ctk.used .ctk-t{opacity:.5}
.ctk.used .ctk-t b{text-decoration:line-through;text-decoration-thickness:2px}
.ctk.used .ctk-t small{color:#9aa3d6}
@media (prefers-reduced-motion:reduce){.ctk .ctk-d{animation:none!important;transition:none}}

/* --- debajo de cada equipo (pantalla grande y juego en vivo): ficha con su nombre abajo --- */
.l2-cmds{display:flex;justify-content:center;gap:16px;gap:clamp(8px,1.4vw,16px)}
.l2-cmds .ctk{--s:54px;--s:clamp(38px,4.4vw,54px);flex-direction:column;gap:4px}
.l2-cmds .ctk-t{justify-items:center}
.l2-cmds .ctk-t b{font-size:15px;font-size:clamp(12px,1.35vw,15px);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.l2-cmds .ctk-t small{display:none}
.l2-cmds .ctk:not(.can):not(.used) .ctk-d{filter:saturate(.75) brightness(.9)}

/* --- barra de comodines en tu celular --- */
.cmdbar .ctk{--s:36px;flex:1;max-width:136px;min-width:0;justify-content:center;padding:6px 8px;border-radius:14px;transition:background .3s,box-shadow .3s}
.cmdbar .ctk-t b{font-size:15px}
.cmdbar .ctk.can{background:rgba(var(--kg),.16);box-shadow:inset 0 0 0 1.5px rgba(var(--kg),.6)}
.cmdbar .ctk:not(.can):not(.used) .ctk-t small{color:#9aa3d6}
/* ===== juntas: reloj redondo, animalitos platicando ===== */
.ring{position:relative;display:inline-grid;place-items:center;flex:none;width:46px;height:46px}
.ring svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rg-bg{fill:#0b0f3a;stroke:rgba(255,255,255,.14);stroke-width:4}
.ring .rg-fg{fill:none;stroke:var(--tc,#ffd76a);stroke-width:4;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .3s linear,stroke .3s}
.ring b{position:relative;font:400 20px 'Lilita One','Rubik',sans-serif;color:#fff}
.ring.hot .rg-fg{stroke:#ff4d6d}.ring.hot b{color:#ff9fb0;animation:rgHot .5s ease-in-out infinite alternate}
@keyframes rgHot{to{transform:scale(1.18)}}
.j-tks{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center}
.tk{position:relative;display:grid;justify-items:center;gap:2px;width:58px}
.tk>i{display:block;width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 3px var(--tc,#ffd76a);background:#0b0f3a;transition:transform .2s}
.tk>i svg{width:100%;height:100%}
.tk small{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 11px Rubik,sans-serif;color:#dfe4ff}
.tk.ty>i{transform:translateY(-3px);box-shadow:0 0 0 3px #fff,0 0 14px var(--tc,#ffd76a)}
.tk-d{position:absolute;top:-6px;right:-2px;display:flex;gap:2px;padding:4px 5px;border-radius:99px;background:#fff}
.tk-d i{width:5px;height:5px;border-radius:50%;background:#2b1840;animation:tkDot 1s ease-in-out infinite}
.tk-d i:nth-child(2){animation-delay:.15s}.tk-d i:nth-child(3){animation-delay:.3s}
@keyframes tkDot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.tk-c{position:absolute;top:28px;right:-6px;font-size:20px;font-style:normal;animation:tkHand .9s ease-in-out infinite alternate}
@keyframes tkHand{to{transform:rotate(-16deg) translateY(-2px)}}
.j-hud{position:fixed;left:14px;bottom:14px;z-index:63;display:grid;gap:8px;width:330px;width:min(92vw,330px);padding:12px 14px;border-radius:20px;background:linear-gradient(180deg,#1e2569,#121746);color:#fff;box-shadow:0 0 0 3px var(--tc,#ffd76a),0 18px 40px rgba(0,0,0,.55)}
.j-hudh{display:flex;align-items:center;gap:10px}.j-hudh>b{flex:1;font:400 19px/1.1 'Lilita One','Rubik',sans-serif}
.j-hudx{margin:0;text-align:center;font:800 13px Rubik,sans-serif;color:#b9c1f5}
.j-hud.wait{box-shadow:0 0 0 3px var(--tc,#ffd76a),0 0 30px var(--tc,#ffd76a),0 18px 40px rgba(0,0,0,.55)}
.lite .tk-d i,.lite .tk-c,.lite .ring.hot b{animation:none!important}
/* reacciones */
.rx{position:fixed;bottom:4%;z-index:90;display:grid;justify-items:center;pointer-events:none;will-change:transform,opacity}
.rx b{font-size:64px;font-size:clamp(34px,5vw,64px);line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.rx i{display:block;width:34px;width:clamp(22px,2.4vw,34px);height:34px;height:clamp(22px,2.4vw,34px);margin-top:-6px;border-radius:50%;box-shadow:0 0 0 2px var(--tc,#fff);background:#0b0f3a}
.rx i svg{width:100%;height:100%}
.ver .rx b{font-size:34px}
/* ruleta: ¡débil! y ¡la rompiste! */
.wbrk{position:absolute;top:0;right:0;bottom:0;left:0;z-index:6;pointer-events:none}
.wbrk svg{width:100%;height:100%;overflow:visible}
.wbrk path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 4px #ff2e88);stroke-dasharray:160;stroke-dashoffset:160;animation:wbrkDraw .5s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes wbrkDraw{to{stroke-dashoffset:0}}
.wbrk-fl{position:absolute;top:-20%;right:-20%;bottom:-20%;left:-20%;z-index:7;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,240,200,.85) 30%,rgba(255,80,120,.4) 55%,transparent 72%);pointer-events:none}
.wbrk-sh{position:absolute;left:50%;top:50%;z-index:8;width:13%;height:13%;clip-path:polygon(50% 0,100% 85%,10% 100%);pointer-events:none}
.j-wfx.brk,.wph-fx.brk{background:linear-gradient(180deg,#fff 0,#ffd0e0 35%,#ff2e88 70%,#a0003c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #3a0018) drop-shadow(0 0 20px rgba(255,46,136,.95));white-space:normal;width:92%;text-align:center;line-height:1.05}
.wph-fx.brk{font-size:44px;font-size:clamp(26px,9vw,44px)}
.j-wfx.deb,.wph-fx.deb{color:#dfe4ff;text-shadow:0 3px 0 #1a1f55,0 0 14px rgba(120,140,255,.6)}
.j-wfx.deb{font-size:48px;font-size:clamp(26px,4.5vw,48px)}.wph-fx.deb{font-size:36px;font-size:clamp(22px,7vw,36px)}

/* ===== auras (rareza) alrededor del animalito ===== */
.aura{position:relative;border-radius:50%}
.aura-com{box-shadow:0 0 0 3px #9aa3b8}
.aura-poc{box-shadow:0 0 0 3px #35e08a,0 0 10px #35e08a}
.aura-rar{box-shadow:0 0 0 3px #3b9bff,0 0 12px #3b9bff;animation:auPulse 1.6s ease-in-out infinite}
.aura-epi{box-shadow:0 0 0 3px #a855f7,0 0 14px #a855f7,0 0 26px rgba(168,85,247,.5)}
.aura-leg{box-shadow:0 0 0 3px #ffb020,0 0 14px #ff8a00,0 -4px 22px #ff5a00;animation:auFire .9s ease-in-out infinite alternate}
.aura-mit{box-shadow:0 0 0 3px #fff,0 0 16px #ff5ce1;animation:auRain 3s linear infinite}
.aura-sec{box-shadow:0 0 0 3px #b3122e,0 0 16px #ff2b4d;animation:auBolt 2.4s steps(1) infinite}
@keyframes auPulse{50%{box-shadow:0 0 0 3px #3b9bff,0 0 22px #3b9bff}}
@keyframes auFire{to{box-shadow:0 0 0 3px #ffd23f,0 0 20px #ff8a00,0 -8px 28px #ff3d00}}
@keyframes auRain{0%{box-shadow:0 0 0 3px #ff5ce1,0 0 16px #ff5ce1}25%{box-shadow:0 0 0 3px #ffd23f,0 0 16px #ffd23f}50%{box-shadow:0 0 0 3px #3fe0cc,0 0 16px #3fe0cc}75%{box-shadow:0 0 0 3px #8b5cf6,0 0 16px #8b5cf6}100%{box-shadow:0 0 0 3px #ff5ce1,0 0 16px #ff5ce1}}
@keyframes auBolt{0%,86%,92%{box-shadow:0 0 0 3px #b3122e,0 0 14px #ff2b4d}88%,94%{box-shadow:0 0 0 3px #fff,0 0 30px #ff2b4d,0 0 60px #fff}}
.lite .aura{animation:none!important}
/* ===== Ronda Relámpago (pantalla y vista del celular) ===== */
.fl{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;display:grid;place-items:center;padding:24px;padding:clamp(8px,2vw,24px);background:radial-gradient(circle at 50% 30%,rgba(255,196,46,.22),rgba(5,8,30,.94) 60%)}
.fl-in{display:grid;gap:10px;width:1100px;width:min(96vw,1100px);max-height:96vh;max-height:96dvh;overflow:auto;padding:24px;padding:clamp(12px,2vw,24px);border-radius:26px;background:linear-gradient(180deg,#232c86,#0e1240);box-shadow:0 0 0 3px #ffc42e,0 0 40px rgba(255,196,46,.45)}
.fl-h{display:flex;align-items:center;justify-content:center;gap:14px}.fl-h>b{font:400 54px 'Lilita One',Rubik,sans-serif;font:400 clamp(28px,4vw,54px) 'Lilita One',Rubik,sans-serif;color:#ffd23f;text-shadow:0 4px 0 #7a3a00,0 0 24px rgba(255,160,0,.6)}
.fl .ring{width:64px;width:clamp(44px,5vw,64px);height:64px;height:clamp(44px,5vw,64px)}.fl .ring b{font-size:28px;font-size:clamp(18px,2.2vw,28px)}
.fl-s{margin:0;text-align:center;color:#dfe4ff;font:700 22px Rubik,sans-serif;font:700 clamp(14px,1.8vw,22px) Rubik,sans-serif}
.fl-tm{display:grid;grid-template-columns:1fr 1fr;gap:24px;gap:clamp(8px,2vw,24px)}
.fl-team{display:grid;gap:10px;padding:18px;padding:clamp(10px,1.6vw,18px);border-radius:20px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 3px var(--tc)}
.fl-team>b{font:400 34px 'Lilita One',Rubik,sans-serif;font:400 clamp(20px,2.6vw,34px) 'Lilita One',Rubik,sans-serif;color:var(--tc);text-align:center}
.fl-p{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06)}
.fl-p.on{background:rgba(255,215,106,.16);box-shadow:inset 0 0 0 2px #ffd76a}.fl-p.empty{opacity:.5}
.fl-p>i{flex:none;display:grid;place-items:center;width:52px;width:clamp(36px,4vw,52px);height:52px;height:clamp(36px,4vw,52px);border-radius:50%;background:#0b0f3a;font-style:normal;color:#fff}.fl-p>i svg{width:100%;height:100%}
.fl-p>span{flex:1;font:800 22px Rubik,sans-serif;font:800 clamp(14px,1.8vw,22px) Rubik,sans-serif}
.fl-p>em{display:flex;gap:5px}.fl-p u{display:block;width:16px;width:clamp(10px,1.2vw,16px);height:16px;height:clamp(10px,1.2vw,16px);border-radius:50%;background:rgba(255,255,255,.18);text-decoration:none}.fl-p u.on{background:#ffd23f;box-shadow:0 0 8px #ffb020}
.fl-bd{display:grid;gap:6px}
.fl-row{display:grid;grid-template-columns:min0 1fr 1fr;grid-template-columns:minmax(0,1.1fr) 1fr 1fr;gap:8px;align-items:stretch}
.fl-hd b{text-align:center;color:var(--tc);font:400 26px 'Lilita One',Rubik,sans-serif;font:400 clamp(16px,2vw,26px) 'Lilita One',Rubik,sans-serif}
.fl-q{align-self:center;color:#fff;font:700 17px/1.25 Rubik,sans-serif;font:700 clamp(12px,1.4vw,17px)/1.25 Rubik,sans-serif}
.fl-cs{display:grid;gap:4px}
.fl-c{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;min-height:56px;min-height:clamp(40px,4.4vw,56px);padding:4px 10px;border-radius:10px;background:#141a5c;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.fl-c small{grid-column:1/-1;color:#9aa3d9;font-size:13px;font-size:clamp(10px,1.1vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-c b{color:#fff;font:400 22px 'Lilita One',Rubik,sans-serif;font:400 clamp(14px,1.7vw,22px) 'Lilita One',Rubik,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fl-c em{font:400 26px 'Lilita One',Rubik,sans-serif;font:400 clamp(16px,2vw,26px) 'Lilita One',Rubik,sans-serif;font-style:normal;color:#ffd23f}
.fl-c:not(.on) *{visibility:hidden}.fl-c.on.hit{background:linear-gradient(180deg,#1f6fd1,#164aa0);box-shadow:inset 0 0 0 2px var(--tc)}.fl-c.on.miss{background:#3a1030}.fl-c.on.miss em{color:#ff8aa0}
.fl-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fl-sum>div{display:grid;justify-items:center;padding:8px;border-radius:16px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 2px var(--tc)}
.fl-sum small{color:var(--tc);font-weight:800}.fl-sum b{font:400 44px 'Lilita One',Rubik,sans-serif;font:400 clamp(26px,3.4vw,44px) 'Lilita One',Rubik,sans-serif}.fl-sum em{font:400 30px 'Lilita One',Rubik,sans-serif;font:400 clamp(18px,2.2vw,30px) 'Lilita One',Rubik,sans-serif;font-style:normal;color:#ffd23f}
@media (max-width:600px){.fl-row{grid-template-columns:1fr 1fr}.fl-row .fl-q{grid-column:1/-1}.fl-hd>span{display:none}}
.fl-x{display:flex;justify-content:center}.fl-x:empty{display:none}.fl-x button{padding:8px 16px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#dfe4ff;font:800 14px Rubik,sans-serif}
/* relámpago: más compacto en pantallas anchas (que se vean los totales en una tele de 720p) */
@media (min-width:601px){
  .fl-in{gap:8px}
  .fl-row{grid-template-columns:min0 1.2fr 1.2fr;grid-template-columns:minmax(0,.8fr) 1.2fr 1.2fr;gap:8px}
  .fl-cs{grid-template-columns:1fr 1fr;gap:4px}
  .fl-c{min-height:0;padding:3px 8px}
  .fl-c small{font-size:12px;font-size:clamp(9px,.9vw,12px)}
  .fl-c b{font-size:19px;font-size:clamp(13px,1.4vw,19px)}.fl-c em{font-size:22px;font-size:clamp(14px,1.6vw,22px)}
  .fl-q{font-size:15px;font-size:clamp(11px,1.15vw,15px)}
  .fl-h>b{font-size:46px;font-size:clamp(26px,3.4vw,46px)}
}
@supports not (height:1dvh){.fl-in{max-height:96vh}}
/* títulos míticos (arcoíris que corre) y secretos (rojo que chispea) */
.tit-mit{display:inline-block;background:linear-gradient(90deg,#ff5ce1,#ffd23f,#3fe0cc,#8b5cf6,#ff5ce1);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:titRain 3s linear infinite}
@keyframes titRain{to{background-position:200% 0}}
.tit-sec{display:inline-block;color:#ff4d6d!important;text-shadow:0 0 6px #b3122e;animation:titSec 2.6s steps(1) infinite}
@keyframes titSec{0%,84%{transform:none}86%{transform:translate(1px,-1px);text-shadow:0 0 14px #ff2b4d}90%{transform:translate(-1px,1px)}94%{transform:none;text-shadow:0 0 10px #ff2b4d}}
.lite .tit-mit,.lite .tit-sec{animation:none}
/* ===================== COSAS DE LA TIENDITA (iguales en todas las pantallas) ===================== */
/* auras de la tienda */
.aus-menta{box-shadow:0 0 0 3px #3fe0cc,0 0 10px #3fe0cc}
.aus-neon{box-shadow:0 0 0 3px #ff2bd6,0 0 12px #ff2bd6;animation:ausNeon 1.4s steps(1) infinite}
@keyframes ausNeon{50%{box-shadow:0 0 0 3px #00e5ff,0 0 14px #00e5ff}}
.aus-hielo{box-shadow:0 0 0 3px #bfe9ff,0 0 12px #7fd4ff,0 0 22px rgba(255,255,255,.55);animation:ausHie 2.2s ease-in-out infinite}
@keyframes ausHie{50%{box-shadow:0 0 0 3px #fff,0 0 18px #bfe9ff,0 0 30px rgba(127,212,255,.7)}}
.aus-corazon{box-shadow:0 0 0 3px #ff5c9a,0 0 12px #ff5c9a}
.aus-corazon::after{content:'💗';position:absolute;right:-5px;top:-7px;font-size:15px;line-height:1;animation:ausHeart 1.6s ease-in-out infinite;pointer-events:none}
@keyframes ausHeart{50%{transform:translateY(-4px) scale(1.18)}}
.aus-galaxia{box-shadow:0 0 0 3px #6a3cff,0 0 14px #6a3cff,0 0 28px rgba(201,168,255,.5);animation:ausGal 4s linear infinite}
@keyframes ausGal{33%{box-shadow:0 0 0 3px #2a1060,0 0 16px #c9a8ff,0 0 30px rgba(106,60,255,.6)}66%{box-shadow:0 0 0 3px #c9a8ff,0 0 14px #3b9bff,0 0 26px rgba(59,155,255,.5)}}
.aus-oro{box-shadow:0 0 0 3px #ffd23f,0 0 14px #ffb020,0 0 30px rgba(255,210,63,.55);animation:ausOro 1.8s ease-in-out infinite}
@keyframes ausOro{50%{box-shadow:0 0 0 4px #fff3a8,0 0 22px #ffd23f,0 0 40px rgba(255,176,32,.7)}}
.aus-fantasma{box-shadow:0 0 0 3px rgba(220,230,255,.9),0 0 18px rgba(200,215,255,.8);animation:ausFan 3s ease-in-out infinite}
@keyframes ausFan{50%{box-shadow:0 0 0 3px rgba(220,230,255,.3),0 0 26px rgba(200,215,255,.35);opacity:.78}}
.aus-prisma{box-shadow:0 0 0 3px #fff,0 0 18px #ff5ce1;animation:ausPri 1.8s linear infinite}
@keyframes ausPri{0%,100%{box-shadow:0 0 0 3px #ff5c9a,0 0 18px #ff5c9a,0 0 34px #ffd23f}20%{box-shadow:0 0 0 3px #ffd23f,0 0 18px #ffd23f,0 0 34px #3fe0cc}40%{box-shadow:0 0 0 3px #3fe0cc,0 0 18px #3fe0cc,0 0 34px #5b8cff}60%{box-shadow:0 0 0 3px #5b8cff,0 0 18px #5b8cff,0 0 34px #8b5cf6}80%{box-shadow:0 0 0 3px #8b5cf6,0 0 18px #8b5cf6,0 0 34px #ff5c9a}}
.lite .aus-corazon::after{animation:none}
/* título de campeón de temporada: oro que brilla */
.tit-camp{display:inline-block;background:linear-gradient(100deg,#b37a00 0%,#ffd23f 35%,#fff6c8 50%,#ffd23f 65%,#b37a00 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:titCamp 2.6s linear infinite}
@keyframes titCamp{from{background-position:110% 0}to{background-position:-110% 0}}
.lite .tit-camp{animation:none}
/* letras de la tienda (en la pantalla grande y en la muestra del celular) */
.j-say.w-neon #saytx .l2-c,.wrp.w-neon .l2-c{color:#ffe0f8;text-shadow:0 0 4px #fff,0 0 10px #ff2bd6,0 0 22px #ff2bd6;animation:wrNeon 3s steps(1) infinite}
@keyframes wrNeon{0%,90%,96%{opacity:1}93%{opacity:.45}}
.j-say.w-hielo #saytx .l2-c,.wrp.w-hielo .l2-c{color:#eafaff;text-shadow:0 0 6px #7fd4ff,0 0 14px #bfe9ff,0 2px 0 #3b8fd6}
.j-say.w-fuego #saytx .l2-c,.wrp.w-fuego .l2-c{color:#ffe27a;text-shadow:0 -2px 6px #ff8a00,0 -5px 14px #ff3d00;animation:wrFue .45s ease-in-out infinite alternate}
@keyframes wrFue{to{text-shadow:0 -3px 8px #ffb020,0 -8px 18px #ff3d00}}

function stage(mode,o){o=o||{};if(!STG.hs.length||RM()||document.hidden)return;clearInterval(STG.tm);clearTimeout(STG.back);unstrobe();STG.mode=mode;
  const back=ms=>{STG.back=later(ms,()=>{if(STG.mode===mode)stIdle()})},ctr=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
  if(mode==='hit'||mode==='top'||mode==='aim'){const [x,y]=ctr(o.el);STG.hs.forEach((h,i)=>{turn(h,aimAt(h,x,y),mode==='aim'?600:360);tint(h,mode==='aim'?'#ffd76a':i%2?'#fff3c4':'#ffd76a')});
    if(mode==='top'){STG.hs.forEach((h,i)=>tint(h,PAL[i]));strobe(110)}
    if(mode!=='aim')back(mode==='top'?2300:1200)}
  else if(mode==='err'){STG.hs.forEach(h=>{tint(h,'#ff2a4a');const a=ang(h.el);h.el.getAnimations().forEach(x=>x.cancel());h.el.animate([0,-10,9,-7,6,-3,0].map(d=>({transform:`rotate(${a+d}deg)`})),{duration:560,easing:'ease-out',fill:'forwards'})});back(1000)}
  else if(mode==='team'){const [x,y]=ctr(o.el);STG.hs.forEach(h=>{turn(h,aimAt(h,x,y),480);tint(h,o.c)});back(2400)}
  else if(mode==='steal'){const hunt=()=>STG.hs.forEach(h=>{tint(h,'#eaf3ff');turn(h,(Math.random()-.5)*70,1200+Math.random()*700,'ease-in-out')});hunt();STG.tm=setInterval(hunt,1800)}
  else if(mode==='win'){let k=0;STG.hs.forEach((h,i)=>tint(h,PAL[i]));strobe(200);const sw=()=>{STG.hs.forEach((h,i)=>turn(h,((k+i)%2?1:-1)*(18+Math.random()*18),400,'ease-in-out'));k++};sw();STG.tm=setInterval(sw,430);back(o.ms||7000)}
  else if(mode==='wheel'){STG.hs.forEach((h,i)=>{turn(h,aimAt(h,innerWidth/2,innerHeight*.45),500);tint(h,PAL[i])});strobe(o.ms||150)}}

/* ===================== NÚMEROS QUE RUEDAN Y PUNTOS QUE VUELAN ===================== */
function rollEl(el,from,to,delay,ms,tick){if(!el)return;const tok=(el._rt||0)+1;el._rt=tok;el.dataset.v=to;
  if(RM()||from===to){el.textContent=to;return}
  later(delay||0,()=>{if(el._rt!==tok)return;const t0=performance.now();let last=-1,step=0;
    (function f(t){if(el._rt!==tok)return;const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3),v=Math.round(from+(to-from)*e);
      if(v!==last){el.textContent=v;last=v;if(tick&&step++%2===0)sf('xt',.35,1+Math.min(1,k)*.9)}
      if(k<1)requestAnimationFrame(f)})(t0)})}
function setNum(el,v){if(!el)return;const cur=el.dataset.v==null?NaN:+el.dataset.v;if(isNaN(cur)){el.textContent=v;el.dataset.v=v;return}if(cur===v&&!el._rt)return;if(cur===v)return;
  if(Math.abs(v-cur)>0&&v!==0)rollEl(el,cur,v,0,v>cur?420:220);else{el._rt=(el._rt||0)+1;el.textContent=v;el.dataset.v=v}}
let holdBank=0;const holdTeam=[0,0];
function bump(el,s){if(!el||RM())return;try{el.animate([{transform:'scale(1)'},{transform:`scale(${s||1.25})`,offset:.35},{transform:'scale(1)'}],{duration:480,easing:'cubic-bezier(.3,1.6,.5,1)'})}catch(e){}}
function flyChip(from,to,text,cls,ms,onland){if(!from||!to){onland&&onland();return}const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();if(RM()||!a.width){onland&&onland();return}
  const c=document.createElement('div');c.className='fly '+(cls||'');c.textContent=text;document.body.appendChild(c);
  const x0=a.left+a.width/2,y0=a.top+a.height/2,x1=b.left+b.width/2,y1=b.top+b.height/2,dx=x1-x0,dy=y1-y0,lift=Math.min(160,Math.abs(dx)*.35+60);
  c.style.left=x0+'px';c.style.top=y0+'px';
  c.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:0},{transform:'translate(-50%,-50%) scale(1.25)',opacity:1,offset:.15},
    {transform:`translate(calc(-50% + ${dx*.5}px),calc(-50% + ${dy*.5-lift}px)) scale(1.1)`,opacity:1,offset:.55},
    {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.7)`,opacity:.95}],{duration:ms||720,easing:'cubic-bezier(.45,0,.55,1)'}).onfinish=()=>{c.remove();onland&&onland()}}
function sparks(el,n,gold){if(RM()||!el)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cs=gold?['#ffd76a','#fff3c4','#ffb020','#fff']:['#ffd76a','#fff','#9cc0ff','#3fe0cc'];
  for(let i=0;i<n;i++){const p=document.createElement('i');p.className='spk';p.style.left=(cx+(Math.random()-.5)*r.width*.8)+'px';p.style.top=(cy+(Math.random()-.5)*r.height*.6)+'px';p.style.background=cs[i%cs.length];document.body.appendChild(p);
    const a=Math.random()*Math.PI*2,d=40+Math.random()*(gold?170:110);p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`,opacity:0}],{duration:520+Math.random()*420,easing:'cubic-bezier(.15,.7,.35,1)'}).onfinish=()=>p.remove()}}
function shake(){if(RM())return;const g=$('#game');try{g.animate([0,-12,11,-9,7,-4,2,0].map(x=>({transform:`translateX(${x}px)`})),{duration:480,easing:'ease-out'})}catch(e){}}

/* la respuesta correcta: salta, da vuelta y media, chispas, sus puntos cuentan y vuelan al banco */
function fxReveal(i,one){const el=$(`#board .tile[data-i="${i}"]`);if(!el)return;stage(one?'top':'hit',{el});if(RM())return;
  const inn=$('.in',el),ap=$('.ap',el),g=S.game,p=curQ().a[i].p,m=mult(g.ri);
  el.classList.add('rvx');later(1100,()=>el.classList.remove('rvx'));
  el.animate([{transform:'scale(1)'},{transform:'scale(1.12)',offset:.2},{transform:'scale(1)'}],{duration:950,easing:'cubic-bezier(.3,1.4,.5,1)'});
  inn.animate([{transform:'rotateX(0deg)'},{transform:'rotateX(-540deg)'}],{duration:850,easing:'cubic-bezier(.25,.75,.3,1.08)'});
  later(400,()=>sparks(el,one?34:18,one));
  if(one)later(450,()=>{const r=el.getBoundingClientRect(),b=document.createElement('div');b.className='fly pink n1';b.textContent='¡LA #1!';b.style.left=(r.left+r.width/2)+'px';b.style.top=r.top+'px';document.body.appendChild(b);b.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(-12deg)',opacity:0},{transform:'translate(-50%,-90%) scale(1.25) rotate(-6deg)',opacity:1,offset:.25},{transform:'translate(-50%,-90%) scale(1) rotate(-6deg)',opacity:1,offset:.75},{transform:'translate(-50%,-150%) scale(.9) rotate(-6deg)',opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=()=>b.remove()});
  if(ap)rollEl(ap,0,p,480,520,true);
  later(1120,()=>flyChip(ap||el,$('#bv'),'+'+p*m,'gold',720,()=>{holdBank=Math.max(0,holdBank-1);sf('land',.8);const bv=$('#bv');bump(bv,1.3);if(S.game)rollEl(bv,+bv.dataset.v||0,S.game.done?Math.abs(S.game.sc[0]-S.game.sc[1]):bank(),0,420)}))}
/* los puntos del banco vuelan al equipo */
function fxAward(t){const g=S.game,from=$('#bv'),to=$('#ts'+(t+1)),card=$('#team'+(t+1));stage('team',{el:card,c:t?'#ffd76a':'#3fe0cc'});if(!sf('awd',.8))play(SY.ding);
  flyChip(from,to,'+'+bank(),t?'gold':'teal',800,()=>{holdTeam[t]=Math.max(0,holdTeam[t]-1);sf('land',.8);bump(card,1.08);rollEl(to,+to.dataset.v||0,score(t),0,700,true)})}

/* se apagan las luces, cada respuesta sale en grande al centro (de la que menos votos tuvo a la #1) y vuela a su lugar */
let showRun=0;
function showCard(i){const c=$('#show'),a=curQ().a[i];$('.sn',c).textContent=i+1;$('.st',c).textContent=a.t;$('.sp',c).textContent=a.p;$('.s1',c).hidden=i!==0;c.classList.toggle('one',i===0);c.hidden=false;
  if(RM()){c.style.opacity=1;return}c.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(-10deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.1) rotate(2deg)',opacity:1,offset:.6},{transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'})}
function flyCard(t,done){const c=$('#show');if(RM()||!t){c.hidden=true;done();return}const cr=c.getBoundingClientRect(),tr=t.getBoundingClientRect(),dx=(tr.left+tr.width/2)-(cr.left+cr.width/2),dy=(tr.top+tr.height/2)-(cr.top+cr.height/2),s=Math.min(1,tr.width/cr.width);
  c.getAnimations().forEach(a=>a.cancel());c.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${s})`,opacity:.9}],{duration:420,easing:'cubic-bezier(.5,0,.75,.4)'}).onfinish=()=>{c.hidden=true;done()}}
function revealShow(){const g=S.game;if(!g||g.done)return;const key=g.ri+'|'+curQ().q;
  if(showRun){showRun=0;$('#show').hidden=true;$('#game').classList.remove('rvon');stIdle();g.rev.forEach((r,i)=>{if(!r){g.rev[i]=true;g.cnt[i]=false}});save();refreshBoard();return}
  const order=g.rev.map((r,i)=>r?-1:i).filter(i=>i>=0).sort((a,b)=>b-a);if(!order.length)return;
  const tok=++flowTok,run=showRun=Date.now(),alive=()=>showRun===run&&S.game===g&&!g.done&&g.ri+'|'+curQ().q===key;
  $('#game').classList.add('rvon');cinta('¡Las que faltaron!','Vamos a ver qué más dijo la gente','c-pink');mSetBase('dim');
  let k=0;const step=()=>{if(!alive())return end();if(k>=order.length)return end();const i=order[k++],t=$(`#board .tile[data-i="${i}"]`),last=k===order.length,one=i===0;
    if(t)t.classList.add('aim');stage('aim',{el:t||$('#board')});
    let d=650;if(last){sf('redoble',.85);d=1350}else play(SY.pre);
    later(d,()=>{if(!alive())return end();showCard(i);pulse(k);mFlashOn(one||last?'blink':'fast',one?1800:700);
      if(one)play(SY.top);else if(last){}else if(!sf(S.rsnd||'r1',.85))play(SY.ding);
      later(one?1900:last?1500:1150,()=>{if(!alive())return end();flyCard(t,()=>{if(!alive())return end();if(t)t.classList.remove('aim');g.rev[i]=true;g.cnt[i]=false;save();refreshBoard();play(SY.dest);if(t)sparks(t,10,one);later(320,step)})})})};
  const end=()=>{if(showRun===run){showRun=0}$('#game').classList.remove('rvon');$$('#board .tile.aim').forEach(t=>t.classList.remove('aim'));$('#show').hidden=true;if(STG.mode==='aim')stIdle();mSetBase('');if(tok===flowTok&&S.game===g&&!g.done){mFlashOn('blink',1200)}};
  later(2200,step)}

function shopDay(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shopRng(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

const SHOPW=[34,28,20,11,5.5,1.5],SHOPWF=[0,0,45,32,18,5];
function shopToday(day){const rnd=shopRng('100f-tienda:'+(day||shopDay())),used=new Set(),out=[];
  const roll=w=>{let x=rnd()*w.reduce((a,b)=>a+b,0);for(let r=0;r<w.length;r++){x-=w[r];if(x<0)return r}return 0};
  const pickOf=r=>{for(let rr=r;rr>=0;rr--){const L=SHOP.filter(x=>x.r===rr&&!used.has(x.k+':'+x.id));if(L.length){const it=L[Math.floor(rnd()*L.length)];used.add(it.k+':'+it.id);return it}}return null};
  const f=pickOf(roll(SHOPWF));if(f)out.push({it:f,p:Math.round(f.p*.85/10)*10,star:1});
  while(out.length<7){const it=pickOf(roll(SHOPW));if(!it)break;out.push({it,p:it.p})}return out}

const XSVG='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M24 24 76 76M76 24 24 76"/></svg>';
/* pregunta */
function qIdle(){qLen('');F.qshown=false;$('#qhead').innerHTML=cellsHTML(HEAD,true);$('#qb').innerHTML=cellsHTML('100 Familiares dijeron');$('#qp').classList.remove('lit')}
function qLen(q){const b=$('#qb'),n=(q||'').length;b.classList.toggle('long',n>34&&n<=60);b.classList.toggle('xlong',n>60)}
function qShowNow(q){qLen(q);$('#qhead').innerHTML=cellsHTML(HEAD);$('#qb').innerHTML=cellsHTML(q);F.qshown=true;$('#qp').classList.add('lit')}
function qReveal(q){qLen(q);F.qshown=false;$('#qhead').innerHTML=cellsHTML(HEAD,true);$('#qb').innerHTML=cellsHTML(q,true);$('#qp').classList.remove('lit');
  sfr('pa',.8);const hs=[...HEAD.replace(/ /g,'')];$$('#qhead .l2-c').forEach((c,k)=>flipCell(c,hs[k],2+k%3,150+k*30,true));
  const words=q.toUpperCase().split(' '),t0=RM()?0:Math.max(0,QI_T0.pa-VLAG);let end=0;
  $$('#qb .l2-w').forEach((w,wi)=>{const ch=[...words[wi]];$$('.l2-c',w).forEach((c,k)=>{end=Math.max(end,flipCell(c,ch[k],3+Math.floor(Math.random()*3),t0+wi*WD+k*38,true))})});
  T(end+160,()=>{F.qshown=true;sfr('flap2',.55);sfr('qok',.45);const p=$('#qp');p.classList.remove('lit');void p.offsetWidth;p.classList.add('lit')})}
/* tablero */
function drawBoard(n){const b=$('#board');b.style.setProperty('--rows',Math.ceil(n/2));
  b.innerHTML=Array.from({length:n},(_,i)=>`<div class="tile" data-i="${i}" style="--gi:${i}" aria-label="Respuesta ${i+1}"><span class="in"><span class="face front"><b class="num">${i+1}</b></span><span class="face back"><span class="l2-flw"></span><span class="ap"></span></span></span></div>`).join('');
  requestAnimationFrame(()=>marquee($('#marq')))}
function seeIt(el){if(!el)return;const r=el.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)el.scrollIntoView({block:'center',behavior:RM()?'auto':'smooth'})}
function revealT(i,text,pts,how){const t=tile(i);if(!t)return;t.classList.add('on');if(how!=='now')seeIt(t);
  if(how==='now'){$('.l2-flw',t).innerHTML=cellsHTML(text);$('.ap',t).innerHTML=cellsHTML(String(pts));return}
  const lg=Math.min(VLAG,340);if(!RM()){t.animate([{transform:'scale(1)'},{transform:'scale(1.1)',offset:.2},{transform:'scale(1)'}],{duration:900,easing:'cubic-bezier(.3,1.4,.5,1)'}).currentTime=lg;$('.in',t).animate([{transform:'rotateX(0deg)'},{transform:'rotateX(-540deg)'}],{duration:820,easing:'cubic-bezier(.25,.75,.3,1.08)'}).currentTime=lg}
  later(360-lg,()=>{flapText($('.l2-flw',t),text);flapText($('.ap',t),String(pts),true)});
  if(how==='quiet'){play(SY.dest);return}
  sfr(i===0?'top1':'ok1',.85);stage(i===0?'top':'hit',{el:t});later(400,()=>sparks(t,i===0?30:16,i===0));later(1600,stIdle)}
function drawX(x){$$('#xslots .xslot').forEach((s,i)=>{if(i<x){if(!s.firstChild)s.innerHTML=`<div class="xt in">${XSVG}</div>`}else s.innerHTML=''})}
function strikeFx(){play(SY.err);redFlash();stage('err');seeIt($('#xslots'));
  if(!RM()){$('#xbig').animate([{opacity:0,transform:'scale(2.4) rotate(-14deg)'},{opacity:1,transform:'scale(.95) rotate(3deg)',offset:.3},{opacity:1,transform:'scale(1)',offset:.75},{opacity:0,transform:'scale(.9)'}],{duration:1100,easing:'ease-out'});shakeEl($('#marq'),14)}
  later(1400,stIdle)}
function setTurn(t,steal){[0,1].forEach(k=>{$('#tm'+k).classList.toggle('turn',k===t);$('#turn'+k).textContent=steal?'¡Roban!':'¡Contestan!'})}
function bankTo(v,m){const el=$('#bv');if(+el.dataset.v!==v){rollEl(el,+el.dataset.v||0,v,0,420);bump(el,1.25)}$('#bm').textContent=m>1?`×${m} al final`:''}
function scoreTo(t,v,anim){const el=$('#ts'+t);if(+el.dataset.v===v)return;if(anim)rollEl(el,+el.dataset.v||0,v,0,700);else{el.dataset.v=v;el.textContent=v}}
/* quien está contestando (lo mismo que se ve sobre la pregunta en la pantalla grande) */
let SAYW='';
function showSay(t,name,st,q){const s=$('#say');later(50,()=>seeIt($('#qp')));s.style.setProperty('--tc',TCOL[t]||TCOL[0]);s.className='j-say typing';$('#sayav').innerHTML=avSVG(AV[t]||AV[0]);$('#sayav').dataset.av='';$('#sayn').textContent=name;$('#sayst').textContent=st;
  $('#sayq').textContent=q||'';$('#saytx').innerHTML='';SAYW='';s.hidden=false;$('#qp').classList.add('saying');
  if(!RM())s.animate([{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.3,1.4,.5,1)'})}
function sayState(cls,st){const s=$('#say');s.classList.remove('typing','hit','miss','dup','time','grace');s.classList.add(cls);$('#sayst').textContent=st;
  if(!RM())$('#sayst').animate([{transform:'scale(1.5)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:380,easing:'cubic-bezier(.3,1.6,.5,1)'})}
function hideSay(){const s=$('#say');if(s.hidden)return;s.hidden=true;s.className='j-say';$('#qp').classList.remove('saying')}
function sayTyping(k){if(k===SAYW)return;SAYW=k;const w=k?k.split(' ').map(Number):[];$('#saytx').innerHTML=w.map(n=>`<span class="l2-w">${'<span class="l2-c bl"><i></i></span>'.repeat(Math.max(1,Math.min(16,n|0)))}</span>`).join('')}
const SAYTXT={hit:'¡SÍ ESTÁ!',miss:'NO ESTÁ EN EL TABLERO',dup:'¡ESA YA SALIÓ!',time:'¡SE ACABÓ EL TIEMPO!'};
function saySync(s,v){const t=v.ph==='steal'?1-v.ctl:Math.max(0,v.ctl);
  if(!s){if(VSAY)later(300,()=>{if(!VSAY)hideSay()});VSAY=null;return}
  const p=VSAY||{},team=/^(los|las)\s/i.test(s.who);
  if(s.cls==='typing'){if(p.cls!=='typing'||$('#say').hidden)showSay(t,s.who,team?'están pensando':'está escribiendo',v.q);else $('#sayn').textContent=s.who;sayTyping(s.w||'')}
  else if(s.cls==='said'){if($('#say').hidden)showSay(t,s.who,'contestó:',v.q);if(p.cls!=='said'||p.txt!==s.txt){$('#say').classList.remove('typing');$('#sayn').textContent=s.who;$('#sayst').textContent='contestó:';flapText($('#saytx'),s.txt)}}
  else if(p.cls!==s.cls){if($('#say').hidden)showSay(t,s.who,'',v.q);if(p.cls!=='said'&&s.txt)$('#saytx').innerHTML=cellsHTML(s.txt);$('#sayn').textContent=s.who;sayState(s.cls,SAYTXT[s.cls]||'');
    if(s.cls==='miss'){$('#say').classList.add('grace');if(!RM())$('#saybar i').animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:3200,easing:'linear'})}}
  if(s.av&&AVM[s.av]&&$('#sayav').dataset.av!==s.av){$('#sayav').innerHTML=avSVG(s.av);$('#sayav').dataset.av=s.av}
  {const sy=$('#say');$('#sayav').className='j-sayav'+auraCls(s.au==null?-1:s.au);[...sy.classList].forEach(c=>{if(/^w-/.test(c))sy.classList.remove(c)});if(typeof s.wr==='string'&&/^[a-z]{2,12}$/.test(s.wr))sy.classList.add('w-'+s.wr)}
  VSAY=s}
/* reloj al mismo paso que la pantalla grande: cada segundo cae en el mismo instante que allá */
let VD=null,VLAG=0;
function ckTickFx(){if(CK.left>0){if(CK.left<=5){last5(CK.left);if(!RM())$('#hotv').animate([{opacity:0},{opacity:.3+(5-CK.left)*.17},{opacity:0}],{duration:850,easing:'ease-out'})}else sfr(CK.left%2?'tic':'tac',.55);ckDraw('run',true)}}
function ckAlign(left,nxL,fresh){let now=performance.now();while(nxL<=now&&left>0){left--;nxL+=1000}
  if(CK.run&&CK.left===left&&Math.abs((CK.nxL||0)-nxL)<45)return;
  clearInterval(CK.id);const was=CK.run;CK.run=true;CK.done=false;CK.big=false;CK.x=false;CK.left=left;CK.nxL=nxL;hand(CK.tot-left,true);ckDraw('run');if(!was&&fresh&&left===CK.tot)sfr('tic',.6);
  if(left<=0){ckTimeout();return}
  const tk=()=>{CK.left--;hand(CK.tot-CK.left);if(CK.left<=0){ckTimeout();return}ckTickFx();CK.nxL+=1000;CK.id=setTimeout(tk,Math.max(0,CK.nxL-performance.now()))};
  CK.id=setTimeout(tk,Math.max(0,nxL-now))}
function ckSync(c,stopX){if(!c)return;
  if(c.pause){if(CK.run){clearInterval(CK.id);CK.run=false}$('#clk').classList.add('paused');return}$('#clk').classList.remove('paused');
  if(c.tot&&c.tot!==CK.tot&&!CK.run){CK.tot=c.tot;ckBuild();$('#cbulbs').style.setProperty('--n',CK.tot);ckReset()}
  if(c.run&&c.nx&&VD!=null){ckAlign(c.left,c.nx+VD,!CK.run);return}
  if(c.run&&!CK.run){ckStart();if(c.left<CK.tot){CK.left=c.left;hand(CK.tot-CK.left,true);ckDraw('run')}}
  else if(!c.run&&CK.run){if(c.left<=0)ckTimeout();else ckStop(stopX?'x':'ok')}
  else if(c.run&&CK.run&&Math.abs(CK.left-c.left)>1){CK.left=c.left;hand(CK.tot-CK.left,true);ckDraw('run')}
  else if(!c.run&&!CK.run&&c.left===c.tot&&(CK.done||CK.left!==CK.tot)&&!CK.big)ckReset()}
/* cada mensaje de la pantalla del juego */
function apply(v){const first=!V;
  /* hora de la pantalla grande → hora de este celular, y cuánto tardó en llegar este mensaje */
  VD=isFinite(v._d)?v._d-performance.timeOrigin:null;VLAG=VD!=null&&isFinite(v.hts)?Math.max(0,Math.min(700,performance.now()-(v.hts+VD))):0;
  if(Array.isArray(v.names))v.names.forEach((n,t)=>{if(n&&NAMES[t]!==n){NAMES[t]=n;$$('.l2-tn')[t].textContent=n}});
  if(Array.isArray(v.av)&&(first||v.av.join()!==AV.join())){AV=v.av.slice();[0,1].forEach(t=>$('#av'+t).innerHTML=avSVG(AV[t]))}
  $('#rn').textContent=v.sd?'Desempate':(v.rn||1)+(v.rr?' de '+v.rr:'');
  /* nueva ronda o nueva pregunta */
  const q=v.q||'';
  if(q!==VQ){F.tok++;VREV=new Set();VHINT=new Set();VXS=v.xs||0;VSAY=null;hideSay();drawX(v.x||0);
    if(!q){qIdle();drawBoard(v.n||6);if(!CK.run)ckReset()}
    else{drawBoard(v.n||6);if(!first&&v.ph==='q'){scrollTo({top:0,behavior:'smooth'});qReveal(q)}else qShowNow(q)}
    VQ=q}
  const mu=$('#mult');if(v.m&&v.ph&&v.ph!=='wheel'){mu.hidden=false;$('#multv').textContent='×'+v.m;mu.classList.toggle('x4',v.m===4)}else mu.hidden=true;
  /* fichas destapadas */
  (v.rev||[]).forEach(([i,text,pts])=>{if(VREV.has(i))return;VREV.add(i);revealT(i,text,pts,first?'now':(v.ph==='done'&&VPH==='done')?'quiet':'anim')});
  /* errores */
  const xs=v.xs||0;if(xs>VXS&&!first)strikeFx();VXS=xs;drawX(v.x||0);
  /* turno, robo y final */
  if(v.ph==='steal'){setTurn(1-v.ctl,true);if(VPH!=='steal'&&!first){document.body.classList.add('steal');cinta('¡ROBO!',`${losN(1-v.ctl,1)} tienen una sola oportunidad`,'c-pink')}else document.body.classList.add('steal')}
  else{document.body.classList.remove('steal');setTurn(v.ph==='play'?v.ctl:-1,false)}
  bankTo(v.bank||0,v.m||1);
  /* puntos para un equipo: vuelan del banco al marcador */
  if(v.aw&&v.aw.id!==VAW){VAW=v.aw.id;if(!first)awardFx(v.aw)}
  if(Array.isArray(v.sc)&&!FLY)[0,1].forEach(t=>{if(SC[t]!==v.sc[t]){SC[t]=v.sc[t];scoreTo(t,v.sc[t],!first)}});
  if(v.ph==='end'&&VPH!=='end'&&!first){const[a,b]=v.sc,w=a===b?-1:a>b?0:1;cinta(w<0?'¡EMPATE!':`¡GANARON ${losN(w).toUpperCase()}!`,`${NAMES[0]} ${a} · ${NAMES[1]} ${b}`,w<0?'c-pink':w?'c-gold':'c-teal');
    later(300,()=>{sfr('top1',.9);confetti()});later(1400,()=>sfr('pts',.8));if(w>=0){bump($('#tm'+w),1.12);stage('team',{el:$('#tm'+w),c:TCOL[w]});later(2500,stIdle)}}
  /* dos errores: se preparan para robar */
  const wn=v.warn==null?-1:v.warn;$$('.l2-team').forEach((e,k)=>{e.classList.toggle('ready',k===wn);if(k===wn)$('.l2-turn',e).textContent=v.hud?'🕵️ Platicando':'¡Prepárense!'});const s3=$$('#xslots .xslot')[2];if(s3)s3.classList.toggle('next',wn>=0);
  if(wn>=0&&(!V||V.warn!==wn)&&!first){cinta(`¡PREPÁRENSE, ${NAMES[wn].toUpperCase()}!`,'Una ✕ más y pueden robar los puntos',wn?'c-gold':'c-teal');sfr('grow',.5);bump($('#tm'+wn),1.12)}
  /* comodines: tarjetas, pistas, avisos y junta */
  if(v.cmd){const k=JSON.stringify(v.cmd);if(k!==VCMD){const old=VCMD?JSON.parse(VCMD):null;VCMD=k;drawCmdsV(v.cmd,old)}}
  (v.hints||[]).forEach(([i,L])=>{if(VHINT.has(i))return;VHINT.add(i);hintOnV(i,L,!first)});
  if(v.cev&&v.cev.id!==VCEV){const was=VCEV;VCEV=v.cev.id;if(!first&&was!==undefined)cevFx(v.cev)}
  chatV(v.chat);hudPanel(v.hud||null);flDraw(v.fl||null);
  /* premio y ceremonia del final */
  const pz=v.pz||'';$('#pzchip').hidden=!pz;$('#pzt').textContent=pz;
  if(v.fin&&!VFIN){VFIN=1;const f=v.fin;if(first)finShow(f);else later(2700,()=>{if(V&&V.fin)finShow(f)})}else if(!v.fin&&VFIN){VFIN=0;finHide()}
  saySync(v.say||null,v);
  ckSync(v.ck,xs>(V?V.xs||0:0)||(v.say&&(v.say.cls==='miss'||v.say.cls==='time')));
  VPH=v.ph||'';V=v}
addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(d&&d.t==='view'&&d.v)apply(d.v)});
new ResizeObserver(()=>marquee($('#marq'))).observe($('#marq'));
ckBuild();ckReset();qIdle();drawBoard(6);[0,1].forEach(t=>$('#av'+t).innerHTML=avSVG(AV[t]));stInit();
try{document.fonts.load('40px "Lilita One"')}catch(e){}
try{parent.postMessage({t:'ver-listo'},'*')}catch(e){}

/* comodines (solo se ven; los usan desde el celular) */
const CMDSV=[{k:'p',i:'💡',n:'Pista'},{k:'s',i:'🤫',n:'Silencio'},{k:'c',i:'💬',n:'Junta'}];
function drawCmdsV(c,old){$$('.l2-cmds').forEach(box=>{const t=+box.dataset.t;box.innerHTML=CMDSV.map((x,j)=>ctkHTML(x.k,{used:c.u[t][j],can:c.can[t][j],attrs:`data-k="${x.k}"`})).join('');
  if(old)CMDSV.forEach((x,j)=>{if(c.u[t][j]&&!old.u[t][j]&&!RM()){const e=$(`[data-k="${x.k}"]`,box);e.classList.remove('used');void e.offsetWidth;later(30,()=>e.classList.add('used'))}})})}
function hintOnV(i,L,anim){const tl=tile(i);if(!tl||$('.l2-hint',tl))return;const h=document.createElement('span');h.className='l2-hint';h.textContent=L+'…';$('.front',tl).appendChild(h);
  if(!anim||RM())return;seeIt(tl);stage('aim',{el:tl});later(1400,stIdle);h.animate([{transform:'translateY(-50%) scale(.3)',opacity:0},{transform:'translateY(-50%) scale(1.25)',opacity:1,offset:.6},{transform:'translateY(-50%) scale(1)',opacity:1}],{duration:500,delay:250,easing:'cubic-bezier(.3,1.5,.5,1)',fill:'backwards'})}
function cevFx(e){sfr('cmd',.9);const big=e.k==='p'?'💡 ¡PISTA!':e.k==='s'?'🤫 ¡SILENCIO!':'💬 ¡JUNTA DE EQUIPO!';
  const sub=e.k==='p'?`${losN(e.t,1)} usaron su pista: ${e.extra}`:e.k==='s'?`${losN(e.t,1)} silenciaron a ${e.extra}`:`${losN(e.t,1)} se ponen de acuerdo`;
  cinta(big,sub,e.k==='s'?'c-pink':e.t?'c-gold':'c-teal')}
function chatV(c){const p=$('#jchat');if(!p)return;if(!c){p.hidden=true;return}p.hidden=false;p.style.setProperty('--tc',TCOL[c.t]);$('#jchn').textContent=`💬 Junta de ${losN(c.t)}`;ringSet($('#jchr'),c.left,30);talkAvs($('#jchav'),c.ps||[],c.ty,null)}

function awardFx(aw){const{t,pts,why}=aw;
  if(pts>0){FLY=1;flyChip($('#bv'),$('#ts'+t),'+'+pts,t?'gold':'teal',800,()=>{FLY=0;SC[t]+=pts;scoreTo(t,SC[t],true);bump($('#tm'+t),1.08);sfr('pts',.85);stage('team',{el:$('#tm'+t),c:TCOL[t]});later(1800,stIdle)})}
  cinta(pts>0?`¡+${pts} para ${NAMES[t]}!`:why,pts>0?why:'',t?'c-gold':'c-teal')}
/* avisos por adelantado de la pantalla grande: se muestran a la misma hora que allá */
function evRun(e,late){if(!V)return;VLAG=Math.max(0,Math.min(700,late||0));
  if(e.k==='q'){if(e.q===VQ)return;F.tok++;VREV=new Set();VHINT=new Set();VXS=0;VSAY=null;hideSay();drawX(0);drawBoard(e.n||6);scrollTo({top:0,behavior:'smooth'});qReveal(e.q);VQ=e.q;return}
  if(e.q!==VQ)return;
  if(e.k==='rev'){if(VREV.has(e.i))return;VREV.add(e.i);revealT(e.i,e.text,e.pts,e.quiet?'quiet':'anim')}
  else if(e.k==='x'){VXS++;strikeFx();drawX(e.x)}
  else if(e.k==='aw'){if(e.aw.id===VAW)return;VAW=e.aw.id;awardFx(e.aw)}}
addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(!d||d.t!=='ev'||!d.e)return;const ev=d.e;if(ev.k==='react'){reactFx(ev);return}
  const D=isFinite(d._d)?d._d-performance.timeOrigin:null,due=D!=null?ev.at+D:performance.now(),wait=due-performance.now();
  if(wait>0&&wait<2000)setTimeout(()=>evRun(ev,0),wait);else evRun(ev,wait<0?-wait:0)});

}
</script>
