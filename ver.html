.l3-lamps{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:22px;background:linear-gradient(180deg,#1a1d33,#0a0c1c);box-shadow:0 0 0 3px #2c3152,0 10px 24px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.08)}
.l3-lamps i{width:clamp(30px,6vmin,52px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a1218,#1a070b);box-shadow:inset 0 3px 6px rgba(0,0,0,.8);transition:background .06s,box-shadow .06s}
.l3-lamps i.r{background:radial-gradient(circle at 40% 35%,#ffb3bc,#ff2d3d 45%,#a3001a);box-shadow:0 0 16px #ff2d3d,0 0 40px rgba(255,45,61,.6)}
.l3-lamps i.g{background:radial-gradient(circle at 40% 35%,#d9ffe5,#35ff7a 45%,#00992e);box-shadow:0 0 18px #35ff7a,0 0 50px rgba(53,255,122,.7)}
.l3-lamps i.t{background:radial-gradient(circle at 40% 35%,#fff,var(--wc) 50%);box-shadow:0 0 18px var(--wc),0 0 46px var(--wc)}
.l3-sem b{padding:.2em .7em;border-radius:999px;background:#0b0f3a;color:#fff;font:400 clamp(18px,3.6vmin,30px)/1.1 var(--disp);white-space:nowrap;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.6)}
.l3-bz.l3-go .l3-sem b{background:linear-gradient(180deg,#5dff94,#18c454);color:#03361a;font-size:clamp(28px,6vmin,54px)}
.l3-sem b.wn{background:var(--wc);color:var(--cink)}
.l3-bz::after{content:"";position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
.l3-bz.flash::after{animation:l3flash .5s ease-out}
@keyframes l3flash{0%{opacity:.55}100%{opacity:0}}
.l3-bzx{position:absolute;right:10px;top:10px;z-index:6;width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font:800 18px Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.l3-tm{position:absolute;z-index:6;padding:4px 12px;border-radius:999px;background:#fff8ec;color:var(--cink);font:800 15px Rubik,sans-serif;white-space:nowrap;pointer-events:none;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.l3-spk{position:fixed;z-index:80;width:9px;height:9px;border-radius:50%;pointer-events:none}
/* celular parado: un equipo arriba (volteado) y otro abajo */
@media (max-aspect-ratio:3/4){
  .l3-bz{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .l3-half.h0 .l3-hin{transform:rotate(180deg)}
  .l3-lamps{flex-direction:row}
  .l3-sem{flex-direction:row}
  .l3-dome{width:min(36vh,52vw,240px)}
}

/* tablero de sonidos */
.l3-sb .l2-sg h3{font-size:19px}

@media (prefers-reduced-motion:reduce){.l3-half::before,.l3-ring,.l3-rays,.l3-arc,.l3-wsw.sway,.l3-clk .l3-cg{animation:none!important}}

.conf{z-index:90}

/* regla de adelantarse */
.l3-rule{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:8px 0 0;font:700 12px Rubik,sans-serif;color:var(--mute)}
.l3-rule button{padding:6px 11px;border:0;border-radius:999px;background:#1e2569;color:var(--mute);font:800 12px Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(156,192,255,.18)}
.l3-rule button[aria-pressed=true]{background:#fff8ec;color:var(--cink);box-shadow:0 0 0 2px #ffd76a}
.l3-rx{padding:5px 11px;border-radius:999px;background:#0b0f3a;color:#ffd76a;font:800 13px Rubik,sans-serif;box-shadow:inset 0 0 0 2px rgba(255,215,106,.35)}
/* se adelantó */
.l3-fs{position:absolute;left:50%;top:50%;z-index:4;margin:0;padding:.12em .5em;border-radius:14px;background:#ff2d4d;color:#fff;font:400 clamp(20px,4.3vw,46px)/1.05 var(--disp);white-space:nowrap;box-shadow:0 0 0 4px #fff,0 0 34px rgba(255,45,77,.9);translate:-50% -50%;opacity:0;pointer-events:none}
.l3-half.l3-foul{background:radial-gradient(circle at 50% 55%,#7a1024,#3a0612 60%,#14020a)}
.l3-half.l3-foul .l3-cap{filter:grayscale(1) brightness(.55);transform:translateY(10px);box-shadow:0 2px 0 var(--tdd)}
.l3-half.l3-foul .l3-bn{color:#ff8fa3}
.l3-half.l3-foul .l3-bs{color:#ffd0d8}
.l3-sem b.l3-fl{background:#ff2d4d;color:#fff;font-size:clamp(26px,5.5vmin,48px)}
/* foto finish */
.l3-card{position:absolute;left:50%;bottom:4vh;--cy:0px;z-index:5;width:min(92vw,380px);padding:12px 14px 10px;border-radius:18px;background:linear-gradient(180deg,#141a5c,#0a0e3a);box-shadow:0 0 0 3px #ffd76a,0 14px 40px rgba(0,0,0,.7);transform:translate(-50%,var(--cy));text-align:center;pointer-events:none}
.l3-card .l3-ct{display:block;margin:0 0 8px;font:400 18px/1 var(--disp);color:#ffd76a;letter-spacing:.04em}
.l3-lane{display:grid;grid-template-columns:7.6em 1fr 4.2em;align-items:center;gap:8px;margin:5px 0;font:800 13px Rubik,sans-serif;text-align:left}
.l3-lane span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3-lane i{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.l3-lane em{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),#fff);transform-origin:0 50%;transform:scaleX(var(--w))}
.l3-lane em.nt{background:repeating-linear-gradient(-45deg,#3a3f74 0 5px,#2c3166 5px 10px)}
.l3-lane b{font:400 17px var(--disp);text-align:right;color:#fff}
.l3-card .l3-cbig{margin:2px 0 6px;font:800 15px/1.3 Rubik,sans-serif}
.l3-card .l3-cbig b{font:400 22px var(--disp);color:#ff8fa3}
.l3-card .l3-cv{margin:8px 0 2px;font:400 22px/1.15 var(--disp);color:#fff}
.l3-rec,.l3-rc{display:block;margin-top:4px;font:800 13px Rubik,sans-serif}
.l3-rec{color:#ffd76a}
.l3-rc{color:var(--mute)}
.l3-card small{display:block;margin-top:4px;color:var(--mute);font:700 11px Rubik,sans-serif}
@media (max-aspect-ratio:3/4){.l3-card{top:50%;bottom:auto;--cy:-50%}}
.l3-half.l3-foul.lose::after{opacity:.2}
@media (max-aspect-ratio:3/4){.l3-fs{font-size:clamp(22px,6.5vw,40px)}}

/* animalitos (SVG) */
.l3-svg{display:block;width:100%;height:100%;clip-path:circle(50%)}
.l3-mini{display:inline-block;width:1.45em;height:1.45em;vertical-align:-.38em;clip-path:circle(50%)}
.l3-turn i .l3-svg{width:100%;height:100%}
.l3-avg{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px 8px}
.l3-avg button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px 2px;border:0;border-radius:14px;background:none;color:var(--mute);font:700 11px/1.15 Rubik,sans-serif;text-align:center;-webkit-tap-highlight-color:transparent}
.l3-avw{display:block;width:min(62px,100%);aspect-ratio:1;border-radius:50%;transition:transform .2s}
.l3-avg button.l3-mine{color:#fff}
.l3-avg button.l3-mine .l3-avw{box-shadow:0 0 0 4px var(--tcol),0 0 18px var(--tcol)}
.l3-avg button.l3-taken{opacity:.38}
.l3-avg button.l3-taken::after{content:"";position:absolute;top:2px;right:calc(50% - 34px);width:16px;height:16px;border-radius:50%;background:var(--ocol);box-shadow:0 0 0 2px #121746}
.l3-avg button:active .l3-avw{transform:scale(.92)}
.l3-arc span svg{display:block;width:clamp(36px,8vw,58px);height:auto}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

/* sala */

.j-dots{display:none;gap:5px;align-items:flex-end;height:.6em}
.j-say.typing .j-dots{display:inline-flex}
.j-dots i{width:.24em;height:.24em;border-radius:50%;background:#fff;animation:jdot 1s ease-in-out infinite}

.ctk{--s:40px;--k1:#ffe680;--k2:#ef9200;--kg:255,186,40;position:relative;display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:none;color:#fff;font:inherit;text-align:left;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

.ctk-d{position:relative;flex:none;display:grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;color:var(--k2);

@keyframes ctkg{0%,100%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px #fff,0 0 0 0 rgba(var(--kg),0),0 3px 8px rgba(0,0,0,.45)}

<script>
{
const APPV='botones-v22';
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

  const len=AC.sampleRate*1.6,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const b=ir.getChannelData(c);for(let i=0;i<len;i++)b[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}

function sparks(el,n,gold){if(RM()||!el)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cs=gold?['#ffd76a','#fff3c4','#ffb020','#fff']:['#ffd76a','#fff','#9cc0ff','#3fe0cc'];

/* la respuesta correcta: salta, da vuelta y media, chispas, sus puntos cuentan y vuelan al banco */
function fxReveal(i,one){const el=$(`#board .tile[data-i="${i}"]`);if(!el)return;stage(one?'top':'hit',{el});if(RM())return;
  const inn=$('.in',el),ap=$('.ap',el),g=S.game,p=curQ().a[i].p,m=mult(g.ri);
  el.classList.add('rvx');later(1100,()=>el.classList.remove('rvx'));
  el.animate([{transform:'scale(1)'},{transform:'scale(1.12)',offset:.2},{transform:'scale(1)'}],{duration:950,easing:'cubic-bezier(.3,1.4,.5,1)'});
  inn.animate([{transform:'rotateX(0deg)'},{transform:'rotateX(-540deg)'}],{duration:850,easing:'cubic-bezier(.25,.75,.3,1.08)'});
  later(400,()=>sparks(el,one?34:18,one));
  if(one)later(450,()=>{const r=el.getBoundingClientRect(),b=document.createElement('div');b.className='fly pink n1';b.textContent='¡LA #1!';b.style.left=(r.left+r.width/2)+'px';b.style.top=r.top+'px';document.body.appendChild(b);b.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(-12deg)',opacity:0},{transform:'translate(-50%,-90%) scale(1.25) rotate(-6deg)',opacity:1,offset:.25},{transform:'translate(-50%,-90%) scale(1) rotate(-6deg)',opacity:1,offset:.75},{transform:'translate(-50%,-150%) scale(.9) rotate(-6deg)',opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=()=>b.remove()});
  if(ap)rollEl(ap,0,p,480,520,true);
  later(1120,()=>flyChip(ap||el,$('#bv'),'+'+p*m,'gold',720,()=>{holdBank=Math.max(0,holdBank-1);sf('land',.8);const bv=$('#bv');bump(bv,1.3);if(S.game)rollEl(bv,+bv.dataset.v||0,S.game.done?Math.abs(S.game.sc[0]-S.game.sc[1]):bank(),0,420)}))}

/* se apagan las luces, cada respuesta sale en grande al centro (de la que menos votos tuvo a la #1) y vuela a su lugar */
let showRun=0;
function showCard(i){const c=$('#show'),a=curQ().a[i];$('.sn',c).textContent=i+1;$('.st',c).textContent=a.t;$('.sp',c).textContent=a.p;$('.s1',c).hidden=i!==0;c.classList.toggle('one',i===0);c.hidden=false;
  if(RM()){c.style.opacity=1;return}c.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(-10deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.1) rotate(2deg)',opacity:1,offset:.6},{transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'})}
function flyCard(t,done){const c=$('#show');if(RM()||!t){c.hidden=true;done();return}const cr=c.getBoundingClientRect(),tr=t.getBoundingClientRect(),dx=(tr.left+tr.width/2)-(cr.left+cr.width/2),dy=(tr.top+tr.height/2)-(cr.top+cr.height/2),s=Math.min(1,tr.width/cr.width);
  c.getAnimations().forEach(a=>a.cancel());c.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${s})`,opacity:.9}],{duration:420,easing:'cubic-bezier(.5,0,.75,.4)'}).onfinish=()=>{c.hidden=true;done()}}
function revealShow(){const g=S.game;if(!g||g.done)return;const key=g.ri+'|'+curQ().q;
  if(showRun){showRun=0;$('#show').hidden=true;$('#game').classList.remove('rvon');stIdle();g.rev.forEach((r,i)=>{if(!r){g.rev[i]=true;g.cnt[i]=false}});save();refreshBoard();return}
  const order=g.rev.map((r,i)=>r?-1:i).filter(i=>i>=0).sort((a,b)=>b-a);if(!order.length)return;
  const tok=++flowTok,run=showRun=Date.now(),alive=()=>showRun===run&&S.game===g&&!g.done&&g.ri+'|'+curQ().q===key;
  $('#game').classList.add('rvon');cinta('¡Las que faltaron!','Vamos a ver qué más dijo la gente','c-pink');mSetBase('dim');
  let k=0;const step=()=>{if(!alive())return end();if(k>=order.length)return end();const i=order[k++],t=$(`#board .tile[data-i="${i}"]`),last=k===order.length,one=i===0;
    if(t)t.classList.add('aim');stage('aim',{el:t||$('#board')});
    let d=650;if(last){sf('redoble',.85);d=1350}else play(SY.pre);
    later(d,()=>{if(!alive())return end();showCard(i);pulse(k);mFlashOn(one||last?'blink':'fast',one?1800:700);
      if(one)play(SY.top);else if(last){}else if(!sf(S.rsnd||'r1',.85))play(SY.ding);
      later(one?1900:last?1500:1150,()=>{if(!alive())return end();flyCard(t,()=>{if(!alive())return end();if(t)t.classList.remove('aim');g.rev[i]=true;g.cnt[i]=false;save();refreshBoard();play(SY.dest);if(t)sparks(t,10,one);later(320,step)})})})};
  const end=()=>{if(showRun===run){showRun=0}$('#game').classList.remove('rvon');$$('#board .tile.aim').forEach(t=>t.classList.remove('aim'));$('#show').hidden=true;if(STG.mode==='aim')stIdle();mSetBase('');if(tok===flowTok&&S.game===g&&!g.done){mFlashOn('blink',1200)}};
  later(2200,step)}

function raceRun(box,L,anim,onFirst,el){const lanes=[...box.querySelectorAll('.hr-lane')],hr=box.querySelector('.hr');if(!hr||!L.length||lanes.length!==L.length)return{first:0,total:0};el=isFinite(el)&&el>0?el:0;
  const d=L.map(p=>Math.round(1000+Math.min(1800,Math.max(0,p.rt-L[0].rt)*4))),total=Math.max(...d);
  if(!anim||el>=total||matchMedia('(prefers-reduced-motion:reduce)').matches){lanes.forEach(l=>l.classList.add('fin','still'));return{first:0,total:0}}
  hr.classList.add('run');
  lanes.forEach((l,i)=>{const o={duration:d[i],easing:'cubic-bezier(.35,0,.65,1)',fill:'forwards'};
    [l.querySelector('.hr-run').animate([{left:'0%'},{left:'100%'}],o),l.querySelector('.hr-tr').animate([{width:'0%'},{width:'100%'}],o)].forEach(a=>a.currentTime=Math.min(el,d[i]));
    if(d[i]<=el){l.classList.add('fin','still');return}
    setTimeout(()=>{l.classList.add('fin');if(i===0){hr.classList.add('flash');if(onFirst)onFirst();if(L[1]&&L[1].rt-L[0].rt<25)hr.classList.add('photo')}},d[i]-el)});
  setTimeout(()=>hr.classList.remove('run'),total-el);return{first:Math.max(0,d[0]-el),total:total-el}}
